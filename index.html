<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f1419">
    <title>Mind Map Pro</title>
    <style>
        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #192734;
            --bg-tertiary: #22303c;
            --bg-card: #1c2732;
            --text-primary: #ffffff;
            --text-secondary: #8899a6;
            --text-muted: #5c6e7e;
            --accent-primary: #1d9bf0;
            --accent-success: #00ba7c;
            --accent-warning: #ffad1f;
            --accent-danger: #f4212e;
            --line-color: #3d5466;
            --line-active: #1d9bf0;
            --node-border: #3d5466;
            --shadow-color: rgba(0,0,0,0.4);
        }

        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f7f9fa;
            --bg-tertiary: #eff3f4;
            --bg-card: #ffffff;
            --text-primary: #0f1419;
            --text-secondary: #536471;
            --text-muted: #8899a6;
            --line-color: #cfd9de;
            --line-active: #1d9bf0;
            --node-border: #cfd9de;
            --shadow-color: rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; touch-action: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            transition: background 0.3s, color 0.3s;
        }

        .app { display: flex; flex-direction: column; height: 100dvh; }

        /* Header */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px;
            padding-top: calc(10px + env(safe-area-inset-top, 0px));
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--node-border);
            z-index: 100; flex-shrink: 0; gap: 8px;
            transition: background 0.3s, border-color 0.3s;
        }
        .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
        .logo { font-size: 20px; flex-shrink: 0; }
        .breadcrumb {
            display: flex; align-items: center; gap: 4px; font-size: 12px;
            color: var(--text-secondary); overflow: hidden; min-width: 0;
        }
        .breadcrumb-item {
            white-space: nowrap; cursor: pointer; padding: 4px 8px;
            background: var(--bg-tertiary); border-radius: 4px;
            max-width: 100px; overflow: hidden; text-overflow: ellipsis;
            transition: all 0.2s;
        }
        .breadcrumb-item:hover { background: var(--bg-card); color: var(--text-primary); }
        .breadcrumb-sep { color: var(--text-muted); flex-shrink: 0; }
        .header-actions { display: flex; gap: 6px; flex-shrink: 0; }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 8px 14px; min-height: 38px; min-width: 38px;
            background: var(--bg-tertiary); color: var(--text-primary);
            border: 1px solid var(--node-border); border-radius: 8px;
            font-size: 13px; font-weight: 500; cursor: pointer;
            transition: all 0.2s; white-space: nowrap;
        }
        .btn:active { transform: scale(0.95); opacity: 0.9; }
        .btn:hover { background: var(--bg-card); }
        .btn-icon { padding: 8px; font-size: 18px; }
        .btn-primary { background: var(--accent-primary); border-color: var(--accent-primary); color: #fff; }
        .btn-primary:hover { opacity: 0.9; }
        .btn.disabled { opacity: 0.4; pointer-events: none; }

        /* Canvas */
        .canvas-container {
            flex: 1; position: relative; overflow: hidden;
            background: var(--bg-primary);
            transition: background 0.3s;
        }
        .canvas-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform-origin: 0 0;
        }

        /* SVG */
        .connections-svg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: visible;
        }
        .connections-svg path {
            fill: none;
            stroke: var(--line-color);
            stroke-width: 2;
            stroke-linecap: round;
        }
        .connections-svg path.highlighted {
            stroke: var(--accent-primary);
            stroke-width: 2.5;
        }

        /* Mindmap */
        .mindmap { position: absolute; top: 50%; left: 40px; }

        /* Nodes */
        .node {
            position: absolute;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            cursor: pointer;
            opacity: 1;
            will-change: transform, opacity;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.25s ease;
        }
        .node.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .node-wrapper { position: relative; display: flex; align-items: center; }

        .depth-indicator {
            position: absolute; left: -6px; top: 50%; transform: translateY(-50%);
            width: 3px; height: 60%; border-radius: 2px;
        }

        .node-content {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 12px;
            background: var(--bg-card);
            border-radius: 8px;
            box-shadow: 0 2px 8px var(--shadow-color);
            border: 2px solid var(--node-border);
            transition: all 0.2s;
            user-select: none; -webkit-user-select: none;
        }
        .node:active .node-content { transform: scale(0.97); }

        .node.root .node-content {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            padding: 12px 18px;
            border-radius: 10px;
        }
        .node.root .node-label { font-size: 15px; font-weight: 600; color: #fff; }
        .node.root .depth-indicator { display: none; }

        .node.expanded .node-content { border-color: var(--accent-primary); }
        .node.selected .node-content {
            border-color: var(--accent-warning);
            box-shadow: 0 0 0 3px rgba(255,173,31,0.25);
        }
        .node.highlighted .node-content {
            border-color: var(--accent-success);
            box-shadow: 0 0 0 3px rgba(0,186,124,0.25);
        }

        .node.leaf .node-content {
            background: var(--bg-tertiary);
            border-color: transparent;
        }

        .node-label {
            font-size: 13px; color: var(--text-primary); font-weight: 500;
            white-space: nowrap; max-width: 160px; overflow: hidden; text-overflow: ellipsis;
            transition: color 0.3s;
        }

        /* Toggle */
        .node-toggle {
            display: flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; margin-left: 4px;
            background: var(--bg-secondary); border-radius: 4px;
            color: var(--text-secondary);
            transition: all 0.2s; flex-shrink: 0;
        }
        .node-toggle svg {
            width: 10px; height: 10px;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .node.expanded .node-toggle { background: var(--accent-primary); color: #fff; }
        .node.expanded .node-toggle svg { transform: rotate(90deg); }
        .node.leaf .node-toggle { display: none; }

        /* Badge */
        .node-badge {
            position: absolute; top: -6px; right: -6px;
            min-width: 18px; height: 18px; padding: 0 5px;
            background: var(--accent-warning); color: #000;
            border-radius: 9px; font-size: 10px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transform: scale(0);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .node:not(.expanded):not(.leaf) .node-badge { opacity: 1; transform: scale(1); }

        /* Tooltip */
        .tooltip {
            position: fixed; background: var(--bg-card); color: var(--text-primary);
            padding: 10px 14px; border-radius: 8px; font-size: 13px;
            box-shadow: 0 4px 20px var(--shadow-color);
            border: 1px solid var(--node-border);
            z-index: 1000; pointer-events: none;
            max-width: 280px; word-wrap: break-word;
            opacity: 0; visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }
        .tooltip.visible { opacity: 1; visibility: visible; }
        .tooltip-path { font-size: 11px; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }

        /* Search Panel */
        .search-panel {
            position: absolute; top: 10px; right: 10px; z-index: 60;
            display: flex; flex-direction: column; gap: 6px;
            width: 220px;
        }
        .search-box {
            display: flex; align-items: center; gap: 8px;
            background: var(--bg-secondary); border: 1px solid var(--node-border);
            border-radius: 8px; padding: 8px 12px;
            transition: all 0.2s;
        }
        .search-box:focus-within { border-color: var(--accent-primary); }
        .search-box svg { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; }
        .search-input {
            flex: 1; background: none; border: none; color: var(--text-primary);
            font-size: 14px; outline: none; width: 100%;
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-results {
            background: var(--bg-secondary); border: 1px solid var(--node-border);
            border-radius: 8px; max-height: 240px; overflow-y: auto;
            display: none;
        }
        .search-results.visible { display: block; }
        .search-result-item {
            padding: 10px 12px; cursor: pointer;
            border-bottom: 1px solid var(--node-border);
            transition: background 0.2s;
        }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:hover, .search-result-item:active { background: var(--bg-tertiary); }
        .search-result-label { font-weight: 500; font-size: 13px; }
        .search-result-path { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
        .search-count { font-size: 11px; color: var(--text-muted); padding: 8px 12px; text-align: center; }

        /* Bottom Toolbar */
        .bottom-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
            background: var(--bg-secondary);
            border-top: 1px solid var(--node-border);
            gap: 8px; flex-shrink: 0;
            transition: background 0.3s, border-color 0.3s;
        }
        .toolbar-group { display: flex; gap: 6px; align-items: center; }
        .zoom-display {
            font-size: 12px; color: var(--text-secondary);
            min-width: 42px; text-align: center; font-weight: 500;
        }

        /* Info Panel */
        .info-panel {
            position: absolute; bottom: 80px; left: 10px;
            background: var(--bg-secondary); border: 1px solid var(--node-border);
            border-radius: 8px; padding: 12px 14px; font-size: 12px;
            z-index: 50; min-width: 120px;
            transition: background 0.3s, border-color 0.3s;
        }
        .info-row { display: flex; justify-content: space-between; padding: 3px 0; }
        .info-label { color: var(--text-muted); }
        .info-value { color: var(--text-primary); font-weight: 600; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            z-index: 200; opacity: 0; visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.visible { opacity: 1; visibility: visible; }
        .modal {
            position: fixed; bottom: 0; left: 0; right: 0;
            max-height: 75vh; background: var(--bg-secondary);
            border-radius: 16px 16px 0 0;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex; flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .modal-overlay.visible .modal { transform: translateY(0); }
        .modal-handle { width: 36px; height: 4px; background: var(--text-muted); border-radius: 2px; margin: 10px auto; }
        .modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px 12px; border-bottom: 1px solid var(--node-border);
        }
        .modal-title { font-size: 16px; font-weight: 600; }
        .modal-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        .editor-textarea {
            flex: 1; width: 100%; padding: 14px; background: var(--bg-primary);
            color: var(--text-primary); border: none;
            font-family: 'SF Mono', Monaco, Consolas, monospace;
            font-size: 13px; line-height: 1.5; resize: none; outline: none;
            min-height: 180px;
        }
        .modal-footer {
            padding: 12px 16px; border-top: 1px solid var(--node-border);
            display: flex; gap: 8px;
        }
        .modal-footer .btn { flex: 1; }

        /* Context Menu */
        .context-menu {
            position: fixed; background: var(--bg-secondary);
            border: 1px solid var(--node-border); border-radius: 10px;
            padding: 6px 0; min-width: 170px;
            box-shadow: 0 8px 30px var(--shadow-color);
            z-index: 200; opacity: 0; visibility: hidden;
            transform: scale(0.95); transition: all 0.15s ease;
        }
        .context-menu.visible { opacity: 1; visibility: visible; transform: scale(1); }
        .context-menu-item {
            padding: 10px 14px; cursor: pointer; font-size: 13px;
            display: flex; align-items: center; gap: 10px;
            transition: background 0.15s;
        }
        .context-menu-item:hover, .context-menu-item:active { background: var(--bg-tertiary); }
        .context-menu-item svg { width: 16px; height: 16px; color: var(--text-secondary); }
        .context-menu-divider { height: 1px; background: var(--node-border); margin: 4px 0; }

        /* Toast */
        .toast {
            position: fixed; bottom: 90px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card); color: var(--text-primary);
            padding: 12px 20px; border-radius: 25px;
            box-shadow: 0 4px 20px var(--shadow-color);
            border: 1px solid var(--node-border);
            z-index: 300;
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
            font-size: 13px; font-weight: 500;
        }
        .toast.visible { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--accent-success); color: #fff; border-color: var(--accent-success); }
        .toast.error { background: var(--accent-danger); color: #fff; border-color: var(--accent-danger); }

        /* Theme Toggle */
        .theme-toggle {
            position: relative;
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }

        /* Responsive */
        @media (min-width: 769px) {
            .modal {
                top: 50%; left: 50%; right: auto; bottom: auto;
                transform: translate(-50%, -50%) scale(0.95);
                width: 550px; max-height: 65vh; border-radius: 12px;
                padding-bottom: 0;
            }
            .modal-overlay.visible .modal { transform: translate(-50%, -50%) scale(1); }
            .modal-handle { display: none; }
            .node-label { max-width: 220px; }
            .search-panel { width: 260px; }
        }

        @media (max-width: 768px) {
            .breadcrumb { display: none; }
            .info-panel { display: none; }
            .btn .label { display: none; }
            .search-panel { left: 10px; right: 10px; width: auto; }
        }

        @media (max-width: 400px) {
            .header-actions { gap: 4px; }
            .btn-icon { min-width: 34px; min-height: 34px; padding: 6px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <span class="logo">🧠</span>
                <nav class="breadcrumb" id="breadcrumb"></nav>
            </div>
            <div class="header-actions">
                <button class="btn btn-icon" onclick="undo()" id="btn-undo" title="Undo">↶</button>
                <button class="btn btn-icon" onclick="redo()" id="btn-redo" title="Redo">↷</button>
                <button class="btn btn-icon theme-toggle" onclick="toggleTheme()" id="btn-theme" title="Toggle Theme">🌙</button>
                <button class="btn btn-icon" onclick="showEditor()" title="Edit">✎</button>
            </div>
        </header>

        <div class="canvas-container" id="canvas-container">
            <div class="canvas-wrapper" id="canvas-wrapper">
                <svg class="connections-svg" id="connections-svg"></svg>
                <div class="mindmap" id="mindmap"></div>
            </div>

            <div class="search-panel">
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" class="search-input" id="search-input" placeholder="Search...">
                </div>
                <div class="search-results" id="search-results"></div>
            </div>

            <div class="info-panel" id="info-panel">
                <div class="info-row">
                    <span class="info-label">Total</span>
                    <span class="info-value" id="stat-total">0</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Visible</span>
                    <span class="info-value" id="stat-visible">0</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Depth</span>
                    <span class="info-value" id="stat-depth">0</span>
                </div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="toolbar-group">
                <button class="btn" onclick="expandAll()">⊕ <span class="label">Expand</span></button>
                <button class="btn" onclick="collapseAll()">⊖ <span class="label">Collapse</span></button>
            </div>
            <div class="toolbar-group">
                <button class="btn btn-icon" onclick="zoomOut()">−</button>
                <span class="zoom-display" id="zoom-level">100%</span>
                <button class="btn btn-icon" onclick="zoomIn()">+</button>
                <button class="btn btn-icon" onclick="fitToScreen()">⤢</button>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <div class="modal-overlay" id="editor-modal" onclick="handleModalClick(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <span class="modal-title">Mermaid Editor</span>
                <button class="btn btn-icon" onclick="hideEditor()">✕</button>
            </div>
            <div class="modal-body">
                <textarea class="editor-textarea" id="mermaid-input" placeholder="mindmap
  root((Title))
    Node 1
      Child 1
    Node 2"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="loadSample()">Sample</button>
                <button class="btn btn-primary" onclick="renderAndClose()">Render</button>
            </div>
        </div>
    </div>

    <div class="context-menu" id="context-menu">
        <div class="context-menu-item" onclick="ctxExpand()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            Expand
        </div>
        <div class="context-menu-item" onclick="ctxCollapse()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
            Collapse
        </div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item" onclick="ctxExpandAll()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
            Expand All
        </div>
        <div class="context-menu-item" onclick="ctxCollapseAll()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8"/></svg>
            Collapse All
        </div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item" onclick="ctxFocus()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
            Focus
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    (function() {
        'use strict';

        // State
        let treeData = null;
        const nodeMap = new Map();
        const nodeElements = new Map();
        let expandedNodes = new Set();
        let selectedNode = null;
        let contextNode = null;
        let hoveredNode = null;
        let isDarkTheme = true;

        // View
        let scale = 1, panX = 0, panY = 0;

        // History
        const history = [];
        let historyIndex = -1;

        // Touch
        const touch = { dragging: false, pinching: false, sx: 0, sy: 0, spx: 0, spy: 0, ss: 1, sd: 0, lt: 0, lp: null };

        // Layout
        const LAYOUT = { nodeH: 42, gap: 12, levelGap: 150 };
        const COLORS = ['#1d9bf0', '#00ba7c', '#7856ff', '#ffad1f', '#f4212e', '#ff6b9d'];

        const SAMPLE = `mindmap
  root((AI Application Architecture))
    Frontend
      React Components
        Dashboard
        Settings Panel
        Data Visualization
      State Management
        Redux Store
        Context API
      Styling
        Tailwind CSS
        Styled Components
    Backend
      API Layer
        REST Endpoints
        GraphQL Schema
        WebSocket Handlers
      Business Logic
        Authentication
        Data Processing
        ML Integration
      Database
        PostgreSQL
        Redis Cache
        S3 Storage
    Infrastructure
      Cloud Services
        AWS Lambda
        EC2 Instances
        CloudFront CDN
      DevOps
        Docker Containers
        Kubernetes
        CI/CD Pipeline
      Monitoring
        CloudWatch
        Sentry
        DataDog
    Security
      Authentication
        OAuth 2.0
        JWT Tokens
      Encryption
        TLS/SSL
        AES-256
      Compliance
        GDPR
        SOC 2`;

        // Parser
        function parse(text) {
            const lines = text.split('\n');
            let root = null;
            const stack = [];
            nodeMap.clear();

            for (const line of lines) {
                if (!line.trim() || line.trim() === 'mindmap') continue;
                const indent = line.search(/\S/);
                const depth = Math.floor(indent / 2);
                let content = line.trim();
                let label = content, isRoot = false;

                if (content.startsWith('root((') && content.endsWith('))')) { label = content.slice(6, -2); isRoot = true; }
                else if (content.startsWith('((') && content.endsWith('))')) label = content.slice(2, -2);
                else if (content.startsWith('(') && content.endsWith(')')) label = content.slice(1, -1);
                else if (content.startsWith('[') && content.endsWith(']')) label = content.slice(1, -1);
                else if (content.startsWith('{{') && content.endsWith('}}')) label = content.slice(2, -2);

                const node = { id: 'n' + Math.random().toString(36).slice(2, 9), label, children: [], depth, isRoot, parent: null };
                nodeMap.set(node.id, node);

                if (isRoot || depth === 0 || !root) {
                    root = node;
                    stack.length = 0;
                    stack.push(node);
                } else {
                    while (stack.length > depth) stack.pop();
                    const parent = stack[stack.length - 1];
                    if (parent) { parent.children.push(node); node.parent = parent; }
                    stack.push(node);
                }
            }
            return root;
        }

        // Layout
        function calcLayout(node, depth = 0, yOff = 0) {
            node._depth = depth;
            node._visible = true;
            let subH = 0;
            const expanded = expandedNodes.has(node.id) || depth === 0;

            if (expanded && node.children.length) {
                node.children.forEach((child, i) => {
                    child._visible = true;
                    subH += calcLayout(child, depth + 1, yOff + subH);
                    if (i < node.children.length - 1) subH += LAYOUT.gap;
                });
            } else {
                hideAll(node);
            }

            node._x = depth * LAYOUT.levelGap;
            node._y = yOff + (subH > 0 ? subH / 2 : LAYOUT.nodeH / 2);
            node._subH = Math.max(LAYOUT.nodeH, subH);
            return node._subH;
        }

        function hideAll(node) {
            node.children.forEach(c => { c._visible = false; hideAll(c); });
        }

        // Get visible node IDs (same logic used by both renderNodes and renderLines)
        function getVisibleNodeIds() {
            const visible = new Set();
            function collect(node) {
                if (!node._visible) return;
                visible.add(node.id);
                if (expandedNodes.has(node.id) || node._depth === 0) {
                    node.children.forEach(collect);
                }
            }
            if (treeData) collect(treeData);
            return visible;
        }

        // Render
        function render() {
            if (!treeData) return;
            calcLayout(treeData);
            renderNodes();
            renderLines();
            updateStats();
            updateBreadcrumb();
            updateHistoryBtns();
        }

        function renderNodes() {
            const container = document.getElementById('mindmap');
            const visible = getVisibleNodeIds();

            function process(node) {
                let el = nodeElements.get(node.id);
                const isVisible = visible.has(node.id);

                if (!isVisible) {
                    if (el) el.classList.add('hidden');
                    node.children.forEach(process);
                    return;
                }

                // Create element if needed
                if (!el) {
                    el = document.createElement('div');
                    el.className = 'node';
                    el.dataset.id = node.id;
                    container.appendChild(el);
                    nodeElements.set(node.id, el);
                }

                const color = COLORS[Math.min(node._depth, COLORS.length - 1)];
                const hasKids = node.children.length > 0;
                const isExpanded = expandedNodes.has(node.id);
                const count = countDesc(node);

                // Update content only if needed
                const contentKey = `${node.label}|${hasKids}|${count}|${color}`;
                if (el.dataset.contentKey !== contentKey) {
                    el.dataset.contentKey = contentKey;
                    el.innerHTML = `
                        <div class="node-wrapper">
                            <div class="depth-indicator" style="background:${color}"></div>
                            <div class="node-content">
                                <span class="node-label">${esc(node.label)}</span>
                            </div>
                            ${hasKids ? `<div class="node-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 6l6 6-6 6"/></svg></div>` : ''}
                            ${hasKids ? `<div class="node-badge">${count}</div>` : ''}
                        </div>
                    `;
                    setupEvents(el, node);
                }

                // Position using transform - use calculated coordinates directly
                el.style.transform = `translate(${node._x}px, ${node._y - 20}px)`;

                // Build class list
                let cls = 'node';
                if (node._depth === 0) cls += ' root';
                if (!hasKids) cls += ' leaf';
                if (hasKids && isExpanded) cls += ' expanded';
                if (selectedNode === node) cls += ' selected';
                el.className = cls;

                node.children.forEach(process);
            }

            process(treeData);
        }

        function renderLines() {
            const svg = document.getElementById('connections-svg');
            svg.innerHTML = '';
            const visible = getVisibleNodeIds();

            // Iterate through all nodes and draw lines to their parent
            nodeMap.forEach(node => {
                if (!node.parent) return;
                if (!visible.has(node.id) || !visible.has(node.parent.id)) return;

                const parent = node.parent;

                // Use calculated coordinates directly (same as index5.html approach)
                const x1 = parent._x + 120; // Approximate node width
                const y1 = parent._y;
                const x2 = node._x;
                const y2 = node._y;
                const dx = Math.abs(x2 - x1) * 0.5;

                const isHighlighted = hoveredNode && (hoveredNode === node || isAncestor(hoveredNode, node));

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`);
                if (isHighlighted) path.classList.add('highlighted');
                svg.appendChild(path);
            });
        }

        function isAncestor(node, potential) {
            let c = node;
            while (c) { if (c === potential) return true; c = c.parent; }
            return false;
        }

        function countDesc(node) {
            let c = node.children.length;
            node.children.forEach(ch => c += countDesc(ch));
            return c;
        }

        function getPath(node) {
            const p = [];
            let c = node;
            while (c) { p.unshift(c); c = c.parent; }
            return p;
        }

        // Events
        function setupEvents(el, node) {
            const hasKids = node.children.length > 0;

            el.onclick = e => {
                e.stopPropagation();
                if (hasKids) { vibrate(10); toggle(node); }
                selectNode(node);
            };

            el.oncontextmenu = e => { e.preventDefault(); showCtx(e, node); };

            el.onmouseenter = () => {
                hoveredNode = node;
                renderLines();
                showTooltip(el, node);
            };

            el.onmouseleave = () => {
                hoveredNode = null;
                renderLines();
                hideTooltip();
            };

            el.ontouchstart = e => {
                touch.lp = setTimeout(() => { vibrate(50); showCtx(e.touches[0], node); }, 500);
            };
            el.ontouchend = () => clearTimeout(touch.lp);
            el.ontouchmove = () => clearTimeout(touch.lp);
        }

        // Operations
        function saveState() {
            if (historyIndex < history.length - 1) history.splice(historyIndex + 1);
            history.push(new Set(expandedNodes));
            if (history.length > 50) history.shift();
            historyIndex = history.length - 1;
            updateHistoryBtns();
        }

        function toggle(node) { expandedNodes.has(node.id) ? collapse(node) : expand(node); }

        function expand(node) {
            if (!node) return;
            saveState();
            expandedNodes.add(node.id);
            render();
        }

        function collapse(node) {
            if (!node || node._depth === 0) return;
            saveState();
            expandedNodes.delete(node.id);
            collapseDesc(node);
            render();
        }

        function collapseDesc(node) {
            node.children.forEach(c => { expandedNodes.delete(c.id); collapseDesc(c); });
        }

        function expandAll() {
            if (!treeData) return;
            saveState();
            (function exp(n) { expandedNodes.add(n.id); n.children.forEach(exp); })(treeData);
            render();
            toast('All expanded');
        }

        function collapseAll() {
            if (!treeData) return;
            saveState();
            expandedNodes.clear();
            expandedNodes.add(treeData.id);
            render();
            toast('All collapsed');
        }

        function selectNode(node) {
            selectedNode = node;
            nodeElements.forEach((el, id) => el.classList.toggle('selected', nodeMap.get(id) === node));
            updateBreadcrumb();
        }

        function focusNode(node) {
            if (!node) return;
            let c = node.parent;
            while (c) { expandedNodes.add(c.id); c = c.parent; }
            render();
            const container = document.getElementById('canvas-container');
            const rect = container.getBoundingClientRect();
            panX = rect.width / 2 - node._x * scale - 80;
            panY = rect.height / 2 - node._y * scale;
            updateTransform();
            selectNode(node);
        }

        // History
        function undo() {
            if (historyIndex <= 0) return;
            historyIndex--;
            expandedNodes = new Set(history[historyIndex]);
            render();
            toast('Undo');
        }

        function redo() {
            if (historyIndex >= history.length - 1) return;
            historyIndex++;
            expandedNodes = new Set(history[historyIndex]);
            render();
            toast('Redo');
        }

        function updateHistoryBtns() {
            document.getElementById('btn-undo').classList.toggle('disabled', historyIndex <= 0);
            document.getElementById('btn-redo').classList.toggle('disabled', historyIndex >= history.length - 1);
        }

        // Theme
        function toggleTheme() {
            isDarkTheme = !isDarkTheme;
            document.body.dataset.theme = isDarkTheme ? 'dark' : 'light';
            document.getElementById('btn-theme').textContent = isDarkTheme ? '🌙' : '☀️';
            document.querySelector('meta[name="theme-color"]').content = isDarkTheme ? '#0f1419' : '#ffffff';
            localStorage.setItem('mindmap-theme', isDarkTheme ? 'dark' : 'light');
            toast(isDarkTheme ? 'Dark mode' : 'Light mode');
        }

        function loadTheme() {
            const saved = localStorage.getItem('mindmap-theme');
            if (saved === 'light') {
                isDarkTheme = false;
                document.body.dataset.theme = 'light';
                document.getElementById('btn-theme').textContent = '☀️';
                document.querySelector('meta[name="theme-color"]').content = '#ffffff';
            }
        }

        // View
        function zoomIn() { setZoom(Math.min(scale * 1.3, 3)); vibrate(5); }
        function zoomOut() { setZoom(Math.max(scale / 1.3, 0.2)); vibrate(5); }

        function setZoom(ns, cx, cy) {
            const c = document.getElementById('canvas-container');
            const r = c.getBoundingClientRect();
            cx = cx ?? r.width / 2;
            cy = cy ?? r.height / 2;
            const ratio = ns / scale;
            panX = cx - (cx - panX) * ratio;
            panY = cy - (cy - panY) * ratio;
            scale = ns;
            updateTransform();
        }

        function fitToScreen() {
            if (!treeData) return;
            const c = document.getElementById('canvas-container');
            const r = c.getBoundingClientRect();
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

            function scan(node) {
                if (!node._visible) return;
                const el = nodeElements.get(node.id);
                const w = el ? el.querySelector('.node-content')?.offsetWidth || 150 : 150;
                minX = Math.min(minX, node._x);
                maxX = Math.max(maxX, node._x + w);
                minY = Math.min(minY, node._y - 20);
                maxY = Math.max(maxY, node._y + 20);
                node.children.forEach(scan);
            }
            scan(treeData);

            const w = maxX - minX + 60, h = maxY - minY + 60;
            scale = Math.max(0.25, Math.min(1.2, Math.min(r.width / w, r.height / h)));
            panX = r.width / 2 - (minX + maxX) / 2 * scale;
            panY = r.height / 2 - (minY + maxY) / 2 * scale;
            updateTransform();
        }

        function updateTransform() {
            document.getElementById('canvas-wrapper').style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
            document.getElementById('zoom-level').textContent = Math.round(scale * 100) + '%';
        }

        // Input
        function initInput() {
            const c = document.getElementById('canvas-container');

            c.ontouchstart = e => {
                if (e.touches.length === 1) {
                    touch.dragging = true;
                    touch.sx = e.touches[0].clientX;
                    touch.sy = e.touches[0].clientY;
                    touch.spx = panX;
                    touch.spy = panY;
                } else if (e.touches.length === 2) {
                    touch.dragging = false;
                    touch.pinching = true;
                    touch.sd = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    touch.ss = scale;
                    touch.px = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    touch.py = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                }
            };

            c.ontouchmove = e => {
                if (touch.pinching && e.touches.length === 2) {
                    e.preventDefault();
                    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    const r = c.getBoundingClientRect();
                    setZoom(Math.max(0.2, Math.min(3, touch.ss * d / touch.sd)), touch.px - r.left, touch.py - r.top);
                } else if (touch.dragging && e.touches.length === 1) {
                    panX = touch.spx + e.touches[0].clientX - touch.sx;
                    panY = touch.spy + e.touches[0].clientY - touch.sy;
                    updateTransform();
                }
            };

            c.ontouchend = e => {
                if (e.touches.length === 0) {
                    const now = Date.now();
                    if (now - touch.lt < 300) { fitToScreen(); vibrate(10); }
                    touch.lt = now;
                    touch.dragging = touch.pinching = false;
                } else if (e.touches.length === 1) {
                    touch.pinching = false;
                    touch.dragging = true;
                    touch.sx = e.touches[0].clientX;
                    touch.sy = e.touches[0].clientY;
                    touch.spx = panX;
                    touch.spy = panY;
                }
            };

            let md = false, msx, msy, mpx, mpy;
            c.onmousedown = e => {
                if (e.target === c || e.target.closest('.canvas-wrapper')) {
                    md = true; msx = e.clientX; msy = e.clientY; mpx = panX; mpy = panY;
                    c.style.cursor = 'grabbing';
                }
            };
            window.onmousemove = e => {
                if (md) { panX = mpx + e.clientX - msx; panY = mpy + e.clientY - msy; updateTransform(); }
            };
            window.onmouseup = () => { md = false; c.style.cursor = ''; };

            c.onwheel = e => {
                e.preventDefault();
                const r = c.getBoundingClientRect();
                setZoom(Math.max(0.2, Math.min(3, scale * (e.deltaY > 0 ? 0.9 : 1.1))), e.clientX - r.left, e.clientY - r.top);
            };

            c.onclick = hideCtx;
        }

        // Search
        function initSearch() {
            const input = document.getElementById('search-input');
            const results = document.getElementById('search-results');
            let timer;

            input.oninput = () => {
                clearTimeout(timer);
                timer = setTimeout(() => {
                    const q = input.value.toLowerCase().trim();
                    if (!q) { results.classList.remove('visible'); clearHL(); return; }

                    const matches = [];
                    nodeMap.forEach(n => { if (n.label.toLowerCase().includes(q)) matches.push(n); });

                    if (matches.length) {
                        results.innerHTML = `<div class="search-count">${matches.length} found</div>` +
                            matches.slice(0, 8).map(n => `
                                <div class="search-result-item" data-id="${n.id}">
                                    <div class="search-result-label">${esc(n.label)}</div>
                                    <div class="search-result-path">${getPath(n).map(p => p.label).join(' → ')}</div>
                                </div>
                            `).join('');
                        results.classList.add('visible');
                        results.querySelectorAll('.search-result-item').forEach(item => {
                            item.onclick = () => {
                                const node = nodeMap.get(item.dataset.id);
                                if (node) { focusNode(node); results.classList.remove('visible'); input.value = ''; clearHL(); }
                            };
                        });
                        hlMatches(matches);
                    } else {
                        results.innerHTML = '<div class="search-count">No results</div>';
                        results.classList.add('visible');
                        clearHL();
                    }
                }, 150);
            };

            input.onkeydown = e => {
                if (e.key === 'Escape') { input.value = ''; results.classList.remove('visible'); clearHL(); }
            };

            document.onkeydown = e => {
                if (e.target.tagName === 'TEXTAREA') return;
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') { e.preventDefault(); input.focus(); input.select(); }
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
                if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault(); redo(); }
            };
        }

        function hlMatches(nodes) { clearHL(); nodes.forEach(n => nodeElements.get(n.id)?.classList.add('highlighted')); }
        function clearHL() { nodeElements.forEach(el => el.classList.remove('highlighted')); }

        // Breadcrumb
        function updateBreadcrumb() {
            const bc = document.getElementById('breadcrumb');
            if (!selectedNode) { bc.innerHTML = ''; return; }
            const path = getPath(selectedNode);
            bc.innerHTML = path.map((n, i) => `
                <span class="breadcrumb-item" data-id="${n.id}" title="${esc(n.label)}">${esc(n.label)}</span>
                ${i < path.length - 1 ? '<span class="breadcrumb-sep">›</span>' : ''}
            `).join('');
            bc.querySelectorAll('.breadcrumb-item').forEach(item => {
                item.onclick = () => { const n = nodeMap.get(item.dataset.id); if (n) focusNode(n); };
            });
        }

        // Stats
        function updateStats() {
            let total = 0, visible = 0, maxD = 0;
            (function count(n, d) {
                total++;
                if (n._visible) visible++;
                maxD = Math.max(maxD, d);
                n.children.forEach(c => count(c, d + 1));
            })(treeData, 0);
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-visible').textContent = visible;
            document.getElementById('stat-depth').textContent = maxD;
        }

        // Tooltip
        function showTooltip(el, node) {
            const tt = document.getElementById('tooltip');
            const r = el.getBoundingClientRect();
            const path = getPath(node).map(n => n.label).join(' → ');
            tt.innerHTML = `<div><strong>${esc(node.label)}</strong></div><div class="tooltip-path">${esc(path)}</div>`;
            const x = Math.min(r.right + 8, window.innerWidth - 290);
            const y = Math.max(10, Math.min(r.top, window.innerHeight - 100));
            tt.style.left = x + 'px';
            tt.style.top = y + 'px';
            tt.classList.add('visible');
        }
        function hideTooltip() { document.getElementById('tooltip').classList.remove('visible'); }

        // Context
        function showCtx(e, node) {
            contextNode = node;
            const m = document.getElementById('context-menu');
            m.style.left = Math.min(e.clientX || e.pageX, window.innerWidth - 180) + 'px';
            m.style.top = Math.min(e.clientY || e.pageY, window.innerHeight - 250) + 'px';
            m.classList.add('visible');
        }
        function hideCtx() { document.getElementById('context-menu').classList.remove('visible'); contextNode = null; }

        function ctxExpand() { expand(contextNode); hideCtx(); }
        function ctxCollapse() { collapse(contextNode); hideCtx(); }
        function ctxExpandAll() {
            if (!contextNode) return;
            saveState();
            (function exp(n) { expandedNodes.add(n.id); n.children.forEach(exp); })(contextNode);
            render();
            hideCtx();
            toast('Subtree expanded');
        }
        function ctxCollapseAll() {
            if (!contextNode) return;
            saveState();
            expandedNodes.add(contextNode.id);
            contextNode.children.forEach(function col(n) { expandedNodes.delete(n.id); n.children.forEach(col); });
            render();
            hideCtx();
            toast('Subtree collapsed');
        }
        function ctxFocus() { focusNode(contextNode); hideCtx(); }

        // Editor
        function showEditor() { document.getElementById('editor-modal').classList.add('visible'); }
        function hideEditor() { document.getElementById('editor-modal').classList.remove('visible'); }
        function handleModalClick(e) { if (e.target.classList.contains('modal-overlay')) hideEditor(); }

        function renderMindmap() {
            const input = document.getElementById('mermaid-input').value;
            treeData = parse(input);
            if (!treeData) { toast('Invalid syntax', 'error'); return; }
            localStorage.setItem('mindmap-data', input);
            expandedNodes.clear();
            (function initExp(n) { expandedNodes.add(n.id); n.children.forEach(initExp); })(treeData);
            history.length = 0;
            historyIndex = -1;
            saveState();
            render();
            setTimeout(fitToScreen, 100);
        }

        function renderAndClose() { renderMindmap(); hideEditor(); toast('Rendered!', 'success'); }
        function loadSample() { document.getElementById('mermaid-input').value = SAMPLE; toast('Sample loaded'); }

        // Utils
        function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        function vibrate(ms) { navigator.vibrate?.(ms); }
        function toast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast visible' + (type ? ' ' + type : '');
            setTimeout(() => t.classList.remove('visible'), 2000);
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            initInput();
            initSearch();
            const saved = localStorage.getItem('mindmap-data');
            document.getElementById('mermaid-input').value = saved || SAMPLE;
            setTimeout(() => { renderMindmap(); fitToScreen(); }, 100);
        });

        // Exports
        window.expandAll = expandAll;
        window.collapseAll = collapseAll;
        window.zoomIn = zoomIn;
        window.zoomOut = zoomOut;
        window.fitToScreen = fitToScreen;
        window.undo = undo;
        window.redo = redo;
        window.toggleTheme = toggleTheme;
        window.showEditor = showEditor;
        window.hideEditor = hideEditor;
        window.handleModalClick = handleModalClick;
        window.renderAndClose = renderAndClose;
        window.loadSample = loadSample;
        window.ctxExpand = ctxExpand;
        window.ctxCollapse = ctxCollapse;
        window.ctxExpandAll = ctxExpandAll;
        window.ctxCollapseAll = ctxCollapseAll;
        window.ctxFocus = ctxFocus;
    })();
    </script>
</body>
</html>

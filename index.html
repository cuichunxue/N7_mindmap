<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1d23">
    <title>Mind Map Viewer</title>
    <style>
        :root {
            --bg-primary: #1a1d23;
            --bg-secondary: #242830;
            --bg-tertiary: #2d3748;
            --bg-node: #2d3748;
            --bg-node-hover: #3d4a5c;
            --text-primary: #e2e8f0;
            --text-secondary: #a0aec0;
            --text-muted: #718096;
            --accent-green: #48bb78;
            --accent-green-dark: #2f855a;
            --accent-blue: #4299e1;
            --accent-orange: #ed8936;
            --line-color: #4a5568;
            --line-color-active: #68d391;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            --radius: 8px;
            --radius-lg: 12px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        /* App Layout */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            height: 100dvh;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            padding-top: calc(8px + var(--safe-top));
            background: var(--bg-secondary);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            z-index: 100;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title .icon {
            font-size: 1.25rem;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px;
            min-height: 40px;
            min-width: 40px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: none;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.95);
            background: var(--bg-node-hover);
        }

        .btn-icon {
            padding: 8px;
            font-size: 1.125rem;
        }

        .btn-primary {
            background: var(--accent-green);
            color: white;
        }

        .btn-primary:active {
            background: var(--accent-green-dark);
        }

        /* Canvas */
        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-primary);
            background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
            background-size: 32px 32px;
        }

        .canvas-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
            will-change: transform;
        }

        /* SVG Connections */
        .connections-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        .connection-line {
            fill: none;
            stroke: var(--line-color);
            stroke-width: 2;
            stroke-linecap: round;
            transition: stroke 0.3s, opacity 0.3s;
        }

        .connection-line.active {
            stroke: var(--line-color-active);
        }

        /* Mind Map */
        .mindmap {
            position: absolute;
            top: 50%;
            left: 60px;
        }

        /* Nodes */
        .node {
            position: absolute;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, opacity;
        }

        .node.animating {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        opacity 0.3s ease;
        }

        .node.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .node-content {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--bg-node);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 2px solid transparent;
            transition: all var(--transition);
            user-select: none;
            -webkit-user-select: none;
        }

        .node:active .node-content {
            transform: scale(0.97);
        }

        .node.root .node-content {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            padding: 12px 20px;
            border-radius: var(--radius-lg);
        }

        .node.root .node-label {
            font-size: 1rem;
            font-weight: 600;
        }

        .node.expanded .node-content {
            border-color: var(--accent-green);
        }

        .node.leaf .node-content {
            background: linear-gradient(135deg, var(--accent-green) 0%, var(--accent-green-dark) 100%);
        }

        .node-label {
            font-size: 0.9rem;
            color: var(--text-primary);
            font-weight: 500;
            white-space: nowrap;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Toggle Button */
        .node-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            margin-left: 4px;
            background: var(--bg-secondary);
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .node-toggle .arrow {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .node.expanded .node-toggle .arrow {
            transform: rotate(90deg);
        }

        .node.expanded .node-toggle {
            background: var(--accent-green);
            color: white;
        }

        .node.leaf .node-toggle {
            display: none;
        }

        /* Child Count Badge */
        .child-count {
            position: absolute;
            top: -6px;
            right: -6px;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            background: var(--accent-orange);
            color: white;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .node:not(.expanded):not(.leaf) .child-count {
            opacity: 1;
            transform: scale(1);
        }

        /* Highlighted */
        .node.highlighted .node-content {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(66, 153, 225, 0.3);
        }

        /* Bottom Toolbar (Mobile) */
        .bottom-toolbar {
            display: none;
            padding: 8px 16px;
            padding-bottom: calc(8px + var(--safe-bottom));
            background: var(--bg-secondary);
            border-top: 1px solid rgba(255,255,255,0.08);
            z-index: 100;
            flex-shrink: 0;
        }

        .toolbar-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .toolbar-row + .toolbar-row {
            margin-top: 8px;
        }

        .btn-toolbar {
            flex: 1;
            max-width: 120px;
        }

        /* Floating Controls */
        .float-controls {
            position: absolute;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 50;
        }

        .float-controls.top-left {
            top: 12px;
            left: 12px;
        }

        .float-controls.top-right {
            top: 12px;
            right: 12px;
        }

        .float-controls.bottom-right {
            bottom: 12px;
            right: 12px;
        }

        .float-controls.bottom-left {
            bottom: 12px;
            left: 12px;
        }

        .zoom-display {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 4px 0;
        }

        /* Stats Badge */
        .stats-badge {
            display: flex;
            gap: 12px;
            padding: 8px 12px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .stat-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Search */
        .search-box {
            position: relative;
        }

        .search-input {
            width: 180px;
            padding: 10px 12px;
            padding-left: 36px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 0.875rem;
            outline: none;
            transition: all var(--transition);
        }

        .search-input:focus {
            border-color: var(--accent-blue);
            width: 220px;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.875rem;
            pointer-events: none;
        }

        /* Editor Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 85vh;
            background: var(--bg-secondary);
            border-radius: 20px 20px 0 0;
            z-index: 201;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding-bottom: var(--safe-bottom);
        }

        .modal-overlay.visible .modal {
            transform: translateY(0);
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: var(--text-muted);
            border-radius: 2px;
            margin: 12px auto;
            flex-shrink: 0;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }

        .modal-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .modal-body {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .editor-textarea {
            flex: 1;
            width: 100%;
            padding: 16px;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: none;
            font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
            font-size: 0.875rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        .modal-footer {
            padding: 12px 16px;
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .modal-footer .btn {
            flex: 1;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 12px 20px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.875rem;
            white-space: nowrap;
        }

        .toast.visible {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* Context Menu */
        .context-menu {
            position: fixed;
            background: var(--bg-secondary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-lg);
            padding: 8px 0;
            min-width: 180px;
            box-shadow: var(--shadow-lg);
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.95);
            transition: all 0.15s ease;
        }

        .context-menu.visible {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        .context-menu-item {
            padding: 12px 16px;
            cursor: pointer;
            font-size: 0.875rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background var(--transition);
        }

        .context-menu-item:active {
            background: var(--bg-node-hover);
        }

        .context-menu-item .icon {
            width: 20px;
            text-align: center;
            color: var(--text-secondary);
        }

        /* Minimap */
        .minimap {
            width: 140px;
            height: 100px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .minimap-content {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .minimap-viewport {
            position: absolute;
            border: 2px solid var(--accent-blue);
            background: rgba(66, 153, 225, 0.15);
            border-radius: 2px;
        }

        .minimap-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
        }

        /* Help Tooltip */
        .help-tooltip {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-secondary);
            padding: 20px 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            z-index: 250;
            max-width: 320px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .help-tooltip.visible {
            opacity: 1;
            visibility: visible;
        }

        .help-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .help-list {
            list-style: none;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .help-list li {
            padding: 6px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .help-list .key {
            background: var(--bg-tertiary);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--text-primary);
        }

        /* Desktop Styles */
        @media (min-width: 769px) {
            .header {
                padding: 12px 24px;
            }

            .header-title {
                font-size: 1.125rem;
            }

            .btn-mobile-only {
                display: none;
            }

            .search-input {
                width: 220px;
            }

            .search-input:focus {
                width: 280px;
            }

            .float-controls.bottom-right {
                bottom: 20px;
                right: 20px;
            }

            .float-controls.bottom-left {
                bottom: 20px;
                left: 20px;
            }

            .float-controls.top-right {
                top: 20px;
                right: 20px;
            }

            .minimap {
                width: 180px;
                height: 130px;
            }

            .node-label {
                max-width: 280px;
            }

            .modal {
                top: 50%;
                left: 50%;
                right: auto;
                bottom: auto;
                transform: translate(-50%, -50%) scale(0.95);
                width: 600px;
                max-height: 80vh;
                border-radius: var(--radius-lg);
                padding-bottom: 0;
            }

            .modal-overlay.visible .modal {
                transform: translate(-50%, -50%) scale(1);
            }

            .modal-handle {
                display: none;
            }
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            .header-title span:not(.icon) {
                display: none;
            }

            .btn-desktop-only {
                display: none;
            }

            .bottom-toolbar {
                display: block;
            }

            .float-controls.top-right .search-box,
            .float-controls.top-right .stats-badge {
                display: none;
            }

            .float-controls.bottom-left {
                display: none;
            }

            .toast {
                bottom: 140px;
            }
        }

        /* Small Mobile */
        @media (max-width: 380px) {
            .btn-toolbar span {
                display: none;
            }

            .btn-toolbar {
                max-width: 50px;
            }
        }

        /* Landscape Mobile */
        @media (max-height: 500px) {
            .bottom-toolbar {
                padding: 6px 16px;
            }

            .toolbar-row + .toolbar-row {
                margin-top: 4px;
            }

            .modal {
                max-height: 95vh;
            }
        }

        /* Loading Spinner */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--bg-tertiary);
            border-top-color: var(--accent-green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Pulse Animation */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            animation: pulse 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-title">
                <span class="icon">🧠</span>
                <span>Mind Map Viewer</span>
            </div>
            <div class="header-actions">
                <button class="btn btn-icon btn-desktop-only" onclick="expandAll()" title="Expand All">
                    ⊕
                </button>
                <button class="btn btn-icon btn-desktop-only" onclick="collapseAll()" title="Collapse All">
                    ⊖
                </button>
                <button class="btn btn-icon" onclick="centerView()" title="Center View">
                    ⌖
                </button>
                <button class="btn btn-icon" onclick="showEditor()" title="Edit">
                    ✎
                </button>
                <button class="btn btn-icon btn-mobile-only" onclick="showHelp()" title="Help">
                    ?
                </button>
            </div>
        </header>

        <!-- Canvas -->
        <div class="canvas-container" id="canvas-container">
            <div class="canvas-wrapper" id="canvas-wrapper">
                <svg class="connections-svg" id="connections-svg"></svg>
                <div class="mindmap" id="mindmap"></div>
            </div>

            <!-- Floating Controls - Top Right -->
            <div class="float-controls top-right">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="search-input" placeholder="Search...">
                </div>
                <div class="stats-badge" id="stats">
                    <span>Nodes: <span class="stat-value" id="node-count">0</span></span>
                    <span>Visible: <span class="stat-value" id="visible-count">0</span></span>
                </div>
            </div>

            <!-- Floating Controls - Bottom Right (Zoom) -->
            <div class="float-controls bottom-right">
                <button class="btn btn-icon" onclick="zoomIn()">+</button>
                <div class="zoom-display" id="zoom-level">100%</div>
                <button class="btn btn-icon" onclick="zoomOut()">−</button>
            </div>

            <!-- Floating Controls - Bottom Left (Minimap) -->
            <div class="float-controls bottom-left">
                <div class="minimap" id="minimap">
                    <div class="minimap-content" id="minimap-content"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Toolbar (Mobile) -->
        <div class="bottom-toolbar">
            <div class="toolbar-row">
                <button class="btn btn-toolbar" onclick="expandAll()">
                    <span>⊕</span> <span>Expand</span>
                </button>
                <button class="btn btn-toolbar" onclick="collapseAll()">
                    <span>⊖</span> <span>Collapse</span>
                </button>
                <button class="btn btn-toolbar" onclick="fitToScreen()">
                    <span>⤢</span> <span>Fit</span>
                </button>
                <button class="btn btn-toolbar" onclick="showSearch()">
                    <span>🔍</span> <span>Search</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Editor Modal -->
    <div class="modal-overlay" id="editor-modal" onclick="handleModalOverlayClick(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <span class="modal-title">Mermaid Editor</span>
                <button class="btn btn-icon" onclick="hideEditor()">✕</button>
            </div>
            <div class="modal-body">
                <textarea class="editor-textarea" id="mermaid-input" placeholder="Enter Mermaid mindmap syntax..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="loadSample()">Sample</button>
                <button class="btn btn-primary" onclick="renderAndClose()">Render</button>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div class="context-menu" id="context-menu">
        <div class="context-menu-item" onclick="expandNode(contextNode)">
            <span class="icon">⊕</span> Expand
        </div>
        <div class="context-menu-item" onclick="collapseNode(contextNode)">
            <span class="icon">⊖</span> Collapse
        </div>
        <div class="context-menu-item" onclick="expandSubtree(contextNode)">
            <span class="icon">⊞</span> Expand Subtree
        </div>
        <div class="context-menu-item" onclick="collapseSubtree(contextNode)">
            <span class="icon">⊟</span> Collapse Subtree
        </div>
        <div class="context-menu-item" onclick="focusNode(contextNode)">
            <span class="icon">⌖</span> Focus
        </div>
    </div>

    <!-- Help Tooltip -->
    <div class="help-tooltip" id="help-tooltip" onclick="hideHelp()">
        <div class="help-title">📱 Gestures</div>
        <ul class="help-list">
            <li><span class="key">Tap</span> Toggle node expand/collapse</li>
            <li><span class="key">Drag</span> Pan the canvas</li>
            <li><span class="key">Pinch</span> Zoom in/out</li>
            <li><span class="key">Long Press</span> Context menu</li>
            <li><span class="key">Double Tap</span> Fit to screen</li>
        </ul>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ==================== State ====================
        let treeData = null;
        let nodeElements = new Map();
        let nodePositions = new Map();
        let expandedNodes = new Set();
        let contextNode = null;
        let allNodes = new Map();

        // View state
        let scale = 1;
        let panX = 0;
        let panY = 0;

        // Touch state
        let touchState = {
            isDragging: false,
            isPinching: false,
            startX: 0,
            startY: 0,
            startPanX: 0,
            startPanY: 0,
            startScale: 1,
            startDistance: 0,
            lastTapTime: 0,
            longPressTimer: null,
            longPressNode: null
        };

        // Layout config
        const LAYOUT = {
            nodeHeight: 44,
            nodeGap: 14,
            levelGap: 180,
            mobileGap: 140
        };

        // Sample data
        const SAMPLE_DATA = `mindmap
  root((Gemini Astra Prototype))
    Overview
      Project Goals
      Target Audience
      Key Benefits
    Features
      Real-time Voice Interaction
      Multi-modal Input Support
      Screen Sharing Capability
      Intelligent Response Generation
    Technologies
      Backend
        Flask
        Flask-SocketIO
        Socket.IO
      AI Services
        Google Generative AI
        Eleven Labs TTS
        SpeechRecognition
      Media Processing
        PIL Pillow
        Pydub
    Installation
      Clone Repository
      Install Dependencies
      Configure API Keys
      Run Server
    Usage
      Start Application
      Configure Settings
      Begin Interaction
    Logging
      Console Output
      File Logging
      Error Tracking`;

        // ==================== Initialization ====================
        document.addEventListener('DOMContentLoaded', () => {
            initTouchHandlers();
            initSearch();
            initKeyboard();

            // Load saved data or sample
            const saved = localStorage.getItem('mindmap-data');
            document.getElementById('mermaid-input').value = saved || SAMPLE_DATA;

            // Initial render
            setTimeout(() => {
                renderMindmap();
                fitToScreen();
            }, 100);
        });

        // ==================== Mermaid Parser ====================
        function parseMermaid(text) {
            const lines = text.split('\n');
            let root = null;
            const stack = [];

            for (let line of lines) {
                if (!line.trim() || line.trim() === 'mindmap') continue;

                const indent = line.search(/\S/);
                const depth = Math.floor(indent / 2);
                let content = line.trim();

                // Parse node format
                let label = content;
                let isRoot = false;

                if (content.startsWith('root((') && content.endsWith('))')) {
                    label = content.slice(6, -2);
                    isRoot = true;
                } else if (content.startsWith('((') && content.endsWith('))')) {
                    label = content.slice(2, -2);
                } else if (content.startsWith('(') && content.endsWith(')')) {
                    label = content.slice(1, -1);
                } else if (content.startsWith('[') && content.endsWith(']')) {
                    label = content.slice(1, -1);
                } else if (content.startsWith('{{') && content.endsWith('}}')) {
                    label = content.slice(2, -2);
                }

                const node = {
                    id: 'n_' + Math.random().toString(36).substr(2, 9),
                    label: label,
                    children: [],
                    depth: depth,
                    isRoot: isRoot
                };

                allNodes.set(node.id, node);

                if (isRoot || depth === 0 || !root) {
                    root = node;
                    stack.length = 0;
                    stack.push(node);
                } else {
                    while (stack.length > depth) stack.pop();
                    const parent = stack[stack.length - 1];
                    if (parent) {
                        parent.children.push(node);
                        node.parent = parent;
                    }
                    stack.push(node);
                }
            }

            return root;
        }

        // ==================== Layout Engine ====================
        function calculateLayout(node, depth = 0, yOffset = 0) {
            const isMobile = window.innerWidth <= 768;
            const gap = isMobile ? LAYOUT.mobileGap : LAYOUT.levelGap;

            node._depth = depth;
            node._visible = true;

            let subtreeHeight = 0;
            const isExpanded = expandedNodes.has(node.id) || depth === 0;

            if (isExpanded && node.children.length > 0) {
                for (let i = 0; i < node.children.length; i++) {
                    const child = node.children[i];
                    child._visible = true;
                    const childHeight = calculateLayout(child, depth + 1, yOffset + subtreeHeight);
                    subtreeHeight += childHeight;
                    if (i < node.children.length - 1) {
                        subtreeHeight += LAYOUT.nodeGap;
                    }
                }
            } else {
                // Mark children as not visible
                function hideChildren(n) {
                    for (const child of n.children) {
                        child._visible = false;
                        hideChildren(child);
                    }
                }
                hideChildren(node);
            }

            const x = depth * gap;
            const y = yOffset + (subtreeHeight > 0 ? subtreeHeight / 2 : LAYOUT.nodeHeight / 2);

            node._x = x;
            node._y = y;
            node._subtreeHeight = Math.max(LAYOUT.nodeHeight, subtreeHeight);

            nodePositions.set(node.id, { x, y, node });

            return node._subtreeHeight;
        }

        // ==================== Rendering ====================
        function renderMindmap() {
            const input = document.getElementById('mermaid-input').value;
            allNodes.clear();
            treeData = parseMermaid(input);

            if (!treeData) {
                showToast('Invalid syntax');
                return;
            }

            // Save to localStorage
            localStorage.setItem('mindmap-data', input);

            // Initialize expanded
            initExpandedNodes(treeData);
            updateLayout();
            updateStats();
        }

        function initExpandedNodes(node) {
            expandedNodes.add(node.id);
            for (const child of node.children) {
                initExpandedNodes(child);
            }
        }

        function updateLayout() {
            if (!treeData) return;
            nodePositions.clear();
            calculateLayout(treeData);
            renderNodes();
            renderConnections();
            updateMinimap();
        }

        function renderNodes() {
            const container = document.getElementById('mindmap');
            const existingNodes = new Map(nodeElements);
            nodeElements.clear();

            function renderNode(node) {
                if (!node._visible) {
                    const existing = existingNodes.get(node.id);
                    if (existing) existing.remove();
                    return;
                }

                let el = existingNodes.get(node.id);
                const isNew = !el;

                if (isNew) {
                    el = document.createElement('div');
                    el.className = 'node';
                    el.id = node.id;
                    container.appendChild(el);
                }

                // Update classes
                el.className = 'node';
                if (node._depth === 0) el.classList.add('root');
                if (node.children.length === 0) el.classList.add('leaf');
                if (expandedNodes.has(node.id) && node.children.length > 0) {
                    el.classList.add('expanded');
                }
                if (isNew) el.classList.add('animating');

                // Position
                el.style.left = `${node._x}px`;
                el.style.top = `${node._y}px`;
                el.style.transform = 'translateY(-50%)';

                // Count descendants
                const descendantCount = countDescendants(node);
                const hasChildren = node.children.length > 0;

                el.innerHTML = `
                    <div class="node-content">
                        <span class="node-label">${escapeHtml(node.label)}</span>
                    </div>
                    ${hasChildren ? `
                        <div class="node-toggle">
                            <span class="arrow">›</span>
                        </div>
                        <div class="child-count">${descendantCount}</div>
                    ` : ''}
                `;

                // Event handlers
                setupNodeEvents(el, node);

                nodeElements.set(node.id, el);
                existingNodes.delete(node.id);

                // Render children
                for (const child of node.children) {
                    renderNode(child);
                }
            }

            renderNode(treeData);

            // Remove old nodes
            existingNodes.forEach(el => el.remove());
        }

        function setupNodeEvents(el, node) {
            const hasChildren = node.children.length > 0;

            // Touch events
            el.addEventListener('touchstart', (e) => {
                touchState.longPressNode = node;
                touchState.longPressTimer = setTimeout(() => {
                    if (touchState.longPressNode === node) {
                        vibrate(50);
                        showContextMenu(e.touches[0], node);
                    }
                }, 500);
            }, { passive: true });

            el.addEventListener('touchend', (e) => {
                clearTimeout(touchState.longPressTimer);
                touchState.longPressNode = null;
            }, { passive: true });

            el.addEventListener('touchmove', () => {
                clearTimeout(touchState.longPressTimer);
                touchState.longPressNode = null;
            }, { passive: true });

            // Click/tap
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                if (hasChildren) {
                    vibrate(10);
                    toggleNode(node);
                }
            });

            // Right click
            el.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                showContextMenu(e, node);
            });
        }

        function countDescendants(node) {
            let count = node.children.length;
            for (const child of node.children) {
                count += countDescendants(child);
            }
            return count;
        }

        function renderConnections() {
            const svg = document.getElementById('connections-svg');
            svg.innerHTML = '';

            function renderConnection(parent, child) {
                if (!parent._visible || !child._visible) return;

                const parentEl = nodeElements.get(parent.id);
                if (!parentEl) return;

                const x1 = parent._x + parentEl.querySelector('.node-content').offsetWidth;
                const y1 = parent._y;
                const x2 = child._x;
                const y2 = child._y;

                const midX = (x1 + x2) / 2;
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`);
                path.setAttribute('class', 'connection-line' + (expandedNodes.has(child.id) ? ' active' : ''));
                svg.appendChild(path);
            }

            function traverse(node) {
                if (!node._visible) return;
                if (expandedNodes.has(node.id) || node._depth === 0) {
                    for (const child of node.children) {
                        if (child._visible) {
                            renderConnection(node, child);
                            traverse(child);
                        }
                    }
                }
            }

            if (treeData) traverse(treeData);
        }

        // ==================== Node Operations ====================
        function toggleNode(node) {
            if (expandedNodes.has(node.id)) {
                collapseNode(node);
            } else {
                expandNode(node);
            }
        }

        function expandNode(node) {
            if (!node) return;
            hideContextMenu();
            expandedNodes.add(node.id);
            animateLayout();
        }

        function collapseNode(node) {
            if (!node || node._depth === 0) return;
            hideContextMenu();
            expandedNodes.delete(node.id);
            collapseDescendants(node);
            animateLayout();
        }

        function collapseDescendants(node) {
            for (const child of node.children) {
                expandedNodes.delete(child.id);
                collapseDescendants(child);
            }
        }

        function expandSubtree(node) {
            if (!node) return;
            hideContextMenu();
            function expand(n) {
                expandedNodes.add(n.id);
                for (const child of n.children) expand(child);
            }
            expand(node);
            animateLayout();
            showToast('Subtree expanded');
        }

        function collapseSubtree(node) {
            if (!node) return;
            hideContextMenu();
            expandedNodes.add(node.id);
            for (const child of node.children) {
                expandedNodes.delete(child.id);
                collapseDescendants(child);
            }
            animateLayout();
            showToast('Subtree collapsed');
        }

        function expandAll() {
            if (!treeData) return;
            function expand(node) {
                expandedNodes.add(node.id);
                for (const child of node.children) expand(child);
            }
            expand(treeData);
            animateLayout();
            showToast('All expanded');
        }

        function collapseAll() {
            if (!treeData) return;
            expandedNodes.clear();
            expandedNodes.add(treeData.id);
            animateLayout();
            showToast('All collapsed');
        }

        function animateLayout() {
            document.querySelectorAll('.node').forEach(el => el.classList.add('animating'));
            updateLayout();
            updateStats();
            setTimeout(() => {
                document.querySelectorAll('.node').forEach(el => el.classList.remove('animating'));
            }, 400);
        }

        function focusNode(node) {
            if (!node) return;
            hideContextMenu();

            // Expand path to node
            let current = node.parent;
            while (current) {
                expandedNodes.add(current.id);
                current = current.parent;
            }
            updateLayout();

            const container = document.getElementById('canvas-container');
            const rect = container.getBoundingClientRect();

            panX = rect.width / 2 - node._x * scale - 100;
            panY = rect.height / 2 - node._y * scale;

            updateTransform();
        }

        // ==================== View Controls ====================
        function zoomIn() {
            const container = document.getElementById('canvas-container');
            const rect = container.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const newScale = Math.min(scale * 1.25, 3);
            const ratio = newScale / scale;

            panX = centerX - (centerX - panX) * ratio;
            panY = centerY - (centerY - panY) * ratio;
            scale = newScale;

            updateTransform();
            vibrate(5);
        }

        function zoomOut() {
            const container = document.getElementById('canvas-container');
            const rect = container.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            const newScale = Math.max(scale / 1.25, 0.2);
            const ratio = newScale / scale;

            panX = centerX - (centerX - panX) * ratio;
            panY = centerY - (centerY - panY) * ratio;
            scale = newScale;

            updateTransform();
            vibrate(5);
        }

        function centerView() {
            if (!treeData) return;

            const container = document.getElementById('canvas-container');
            const rect = container.getBoundingClientRect();

            let minY = Infinity, maxY = -Infinity;
            nodePositions.forEach(({ y, node }) => {
                if (node._visible) {
                    minY = Math.min(minY, y);
                    maxY = Math.max(maxY, y);
                }
            });

            const centerY = (minY + maxY) / 2;
            panX = 40;
            panY = rect.height / 2 - centerY * scale;

            updateTransform();
        }

        function fitToScreen() {
            if (!treeData) return;

            const container = document.getElementById('canvas-container');
            const rect = container.getBoundingClientRect();

            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;

            nodePositions.forEach(({ x, y, node }) => {
                if (node._visible) {
                    minX = Math.min(minX, x);
                    maxX = Math.max(maxX, x + 200);
                    minY = Math.min(minY, y - 25);
                    maxY = Math.max(maxY, y + 25);
                }
            });

            const contentWidth = maxX - minX + 80;
            const contentHeight = maxY - minY + 80;

            const scaleX = rect.width / contentWidth;
            const scaleY = rect.height / contentHeight;
            scale = Math.min(scaleX, scaleY, 1.5);
            scale = Math.max(scale, 0.3);

            const centerX = (minX + maxX) / 2;
            const centerY = (minY + maxY) / 2;

            panX = rect.width / 2 - centerX * scale;
            panY = rect.height / 2 - centerY * scale;

            updateTransform();
        }

        function updateTransform() {
            const wrapper = document.getElementById('canvas-wrapper');
            wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            document.getElementById('zoom-level').textContent = `${Math.round(scale * 100)}%`;
            updateMinimap();
        }

        // ==================== Touch Handlers ====================
        function initTouchHandlers() {
            const container = document.getElementById('canvas-container');

            // Touch start
            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    touchState.isDragging = true;
                    touchState.startX = e.touches[0].clientX;
                    touchState.startY = e.touches[0].clientY;
                    touchState.startPanX = panX;
                    touchState.startPanY = panY;
                } else if (e.touches.length === 2) {
                    touchState.isDragging = false;
                    touchState.isPinching = true;
                    touchState.startDistance = getTouchDistance(e.touches);
                    touchState.startScale = scale;

                    const center = getTouchCenter(e.touches);
                    touchState.pinchCenterX = center.x;
                    touchState.pinchCenterY = center.y;
                }
            }, { passive: true });

            // Touch move
            container.addEventListener('touchmove', (e) => {
                if (touchState.isPinching && e.touches.length === 2) {
                    e.preventDefault();

                    const distance = getTouchDistance(e.touches);
                    const newScale = Math.max(0.2, Math.min(3, touchState.startScale * (distance / touchState.startDistance)));

                    const rect = container.getBoundingClientRect();
                    const centerX = touchState.pinchCenterX - rect.left;
                    const centerY = touchState.pinchCenterY - rect.top;

                    const ratio = newScale / scale;
                    panX = centerX - (centerX - panX) * ratio;
                    panY = centerY - (centerY - panY) * ratio;
                    scale = newScale;

                    updateTransform();
                } else if (touchState.isDragging && e.touches.length === 1) {
                    const dx = e.touches[0].clientX - touchState.startX;
                    const dy = e.touches[0].clientY - touchState.startY;

                    panX = touchState.startPanX + dx;
                    panY = touchState.startPanY + dy;

                    updateTransform();
                }
            }, { passive: false });

            // Touch end
            container.addEventListener('touchend', (e) => {
                if (e.touches.length === 0) {
                    // Double tap detection
                    const now = Date.now();
                    if (now - touchState.lastTapTime < 300) {
                        fitToScreen();
                        vibrate(10);
                    }
                    touchState.lastTapTime = now;

                    touchState.isDragging = false;
                    touchState.isPinching = false;
                } else if (e.touches.length === 1) {
                    touchState.isPinching = false;
                    touchState.isDragging = true;
                    touchState.startX = e.touches[0].clientX;
                    touchState.startY = e.touches[0].clientY;
                    touchState.startPanX = panX;
                    touchState.startPanY = panY;
                }
            }, { passive: true });

            // Mouse events for desktop
            let mouseDown = false;
            let mouseStartX, mouseStartY, mousePanStartX, mousePanStartY;

            container.addEventListener('mousedown', (e) => {
                if (e.target === container || e.target.closest('.canvas-wrapper')) {
                    mouseDown = true;
                    mouseStartX = e.clientX;
                    mouseStartY = e.clientY;
                    mousePanStartX = panX;
                    mousePanStartY = panY;
                    container.style.cursor = 'grabbing';
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (mouseDown) {
                    panX = mousePanStartX + (e.clientX - mouseStartX);
                    panY = mousePanStartY + (e.clientY - mouseStartY);
                    updateTransform();
                }
            });

            window.addEventListener('mouseup', () => {
                mouseDown = false;
                container.style.cursor = '';
            });

            // Wheel zoom
            container.addEventListener('wheel', (e) => {
                e.preventDefault();

                const rect = container.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                const newScale = Math.max(0.2, Math.min(3, scale * delta));

                const ratio = newScale / scale;
                panX = mouseX - (mouseX - panX) * ratio;
                panY = mouseY - (mouseY - panY) * ratio;
                scale = newScale;

                updateTransform();
            }, { passive: false });

            // Click to hide context menu
            container.addEventListener('click', hideContextMenu);
        }

        function getTouchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function getTouchCenter(touches) {
            return {
                x: (touches[0].clientX + touches[1].clientX) / 2,
                y: (touches[0].clientY + touches[1].clientY) / 2
            };
        }

        // ==================== Search ====================
        function initSearch() {
            const input = document.getElementById('search-input');
            let debounceTimer;

            input.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    highlightSearch(e.target.value.toLowerCase());
                }, 150);
            });

            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                    e.preventDefault();
                    input.focus();
                    input.select();
                }
            });
        }

        function highlightSearch(query) {
            let firstMatch = null;

            nodeElements.forEach((el, id) => {
                el.classList.remove('highlighted');
                const node = allNodes.get(id);
                if (query && node && node.label.toLowerCase().includes(query)) {
                    el.classList.add('highlighted');
                    if (!firstMatch) firstMatch = node;
                }
            });

            if (firstMatch) {
                focusNode(firstMatch);
            }
        }

        function showSearch() {
            const query = prompt('Search nodes:');
            if (query) {
                highlightSearch(query.toLowerCase());
            }
        }

        // ==================== Context Menu ====================
        function showContextMenu(e, node) {
            contextNode = node;
            const menu = document.getElementById('context-menu');

            const x = e.clientX || e.pageX;
            const y = e.clientY || e.pageY;

            menu.style.left = `${Math.min(x, window.innerWidth - 200)}px`;
            menu.style.top = `${Math.min(y, window.innerHeight - 250)}px`;
            menu.classList.add('visible');
        }

        function hideContextMenu() {
            document.getElementById('context-menu').classList.remove('visible');
            contextNode = null;
        }

        // ==================== Editor ====================
        function showEditor() {
            document.getElementById('editor-modal').classList.add('visible');
        }

        function hideEditor() {
            document.getElementById('editor-modal').classList.remove('visible');
        }

        function handleModalOverlayClick(e) {
            if (e.target.classList.contains('modal-overlay')) {
                hideEditor();
            }
        }

        function renderAndClose() {
            renderMindmap();
            hideEditor();
            setTimeout(fitToScreen, 100);
            showToast('Rendered!');
        }

        function loadSample() {
            document.getElementById('mermaid-input').value = SAMPLE_DATA;
            showToast('Sample loaded');
        }

        // ==================== Minimap ====================
        function updateMinimap() {
            if (!treeData) return;

            const content = document.getElementById('minimap-content');
            const container = document.getElementById('canvas-container');
            const rect = container.getBoundingClientRect();

            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;

            nodePositions.forEach(({ x, y, node }) => {
                if (node._visible) {
                    minX = Math.min(minX, x);
                    maxX = Math.max(maxX, x + 150);
                    minY = Math.min(minY, y);
                    maxY = Math.max(maxY, y);
                }
            });

            const contentWidth = maxX - minX + 40;
            const contentHeight = maxY - minY + 40;
            const minimapWidth = content.offsetWidth || 140;
            const minimapHeight = content.offsetHeight || 100;
            const minimapScale = Math.min(minimapWidth / contentWidth, minimapHeight / contentHeight) * 0.9;

            content.innerHTML = '';

            // Render dots
            nodePositions.forEach(({ x, y, node }) => {
                if (!node._visible) return;
                const dot = document.createElement('div');
                dot.className = 'minimap-dot';
                dot.style.background = node._depth === 0 ? '#68d391' :
                                       node.children.length === 0 ? '#48bb78' : '#4a5568';
                dot.style.left = `${(x - minX) * minimapScale + 8}px`;
                dot.style.top = `${(y - minY) * minimapScale + 8}px`;
                content.appendChild(dot);
            });

            // Viewport
            const viewport = document.createElement('div');
            viewport.className = 'minimap-viewport';
            viewport.style.left = `${(-panX / scale - minX) * minimapScale + 8}px`;
            viewport.style.top = `${(-panY / scale - minY) * minimapScale + 8}px`;
            viewport.style.width = `${(rect.width / scale) * minimapScale}px`;
            viewport.style.height = `${(rect.height / scale) * minimapScale}px`;
            content.appendChild(viewport);
        }

        // ==================== Stats ====================
        function updateStats() {
            if (!treeData) return;

            let total = 0, visible = 0;
            function count(node) {
                total++;
                if (node._visible) visible++;
                for (const child of node.children) count(child);
            }
            count(treeData);

            document.getElementById('node-count').textContent = total;
            document.getElementById('visible-count').textContent = visible;
        }

        // ==================== Help ====================
        function showHelp() {
            document.getElementById('help-tooltip').classList.add('visible');
        }

        function hideHelp() {
            document.getElementById('help-tooltip').classList.remove('visible');
        }

        // ==================== Keyboard ====================
        function initKeyboard() {
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

                switch(e.key) {
                    case '+': case '=': zoomIn(); break;
                    case '-': zoomOut(); break;
                    case '0': fitToScreen(); break;
                    case 'c': centerView(); break;
                    case 'e': expandAll(); break;
                    case 'w': collapseAll(); break;
                    case 'Escape': hideContextMenu(); hideEditor(); hideHelp(); break;
                }
            });
        }

        // ==================== Utilities ====================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function vibrate(ms) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 2000);
        }

        // ==================== Global Exports ====================
        window.renderMindmap = renderMindmap;
        window.expandAll = expandAll;
        window.collapseAll = collapseAll;
        window.centerView = centerView;
        window.fitToScreen = fitToScreen;
        window.zoomIn = zoomIn;
        window.zoomOut = zoomOut;
        window.showEditor = showEditor;
        window.hideEditor = hideEditor;
        window.handleModalOverlayClick = handleModalOverlayClick;
        window.renderAndClose = renderAndClose;
        window.loadSample = loadSample;
        window.showSearch = showSearch;
        window.showHelp = showHelp;
        window.hideHelp = hideHelp;
        window.expandNode = expandNode;
        window.collapseNode = collapseNode;
        window.expandSubtree = expandSubtree;
        window.collapseSubtree = collapseSubtree;
        window.focusNode = focusNode;
    </script>
</body>
</html>

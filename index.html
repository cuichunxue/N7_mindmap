<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expandable Mind Map - Mermaid Parser</title>
    <style>
        :root {
            --bg-primary: #1a1d23;
            --bg-secondary: #242830;
            --bg-node: #2d3748;
            --bg-node-hover: #3d4a5c;
            --bg-node-expanded: #38a169;
            --bg-node-collapsed: #4a5568;
            --text-primary: #e2e8f0;
            --text-secondary: #a0aec0;
            --accent-green: #48bb78;
            --accent-blue: #4299e1;
            --line-color: #4a5568;
            --line-color-active: #68d391;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
            --transition-fast: 0.15s ease;
            --transition-normal: 0.3s ease;
            --transition-slow: 0.5s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: var(--bg-node);
            color: var(--text-primary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .btn:hover {
            background: var(--bg-node-hover);
            border-color: rgba(255,255,255,0.2);
        }

        .btn-primary {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }

        .btn-primary:hover {
            background: #38a169;
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Editor Panel */
        .editor-panel {
            width: 400px;
            min-width: 300px;
            max-width: 600px;
            background: var(--bg-secondary);
            border-right: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            transition: width var(--transition-normal);
        }

        .editor-panel.collapsed {
            width: 0;
            min-width: 0;
            overflow: hidden;
        }

        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .editor-header h2 {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .editor-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #mermaid-input {
            flex: 1;
            width: 100%;
            padding: 16px;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: none;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.875rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        #mermaid-input::placeholder {
            color: var(--text-secondary);
        }

        .editor-actions {
            padding: 12px 16px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 8px;
        }

        /* Canvas Container */
        .canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-primary);
            background-image:
                radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
            background-size: 40px 40px;
        }

        .canvas-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
        }

        /* Mind Map */
        .mindmap {
            position: absolute;
            top: 50%;
            left: 80px;
            transform: translateY(-50%);
        }

        /* SVG Lines */
        .connections-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        .connection-line {
            fill: none;
            stroke: var(--line-color);
            stroke-width: 2;
            transition: stroke var(--transition-normal), opacity var(--transition-normal);
        }

        .connection-line.active {
            stroke: var(--line-color-active);
        }

        .connection-line.fading {
            opacity: 0;
        }

        /* Node Styles */
        .node {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 0;
            transition: transform var(--transition-normal), opacity var(--transition-normal);
            cursor: pointer;
        }

        .node.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-20px);
        }

        .node-content {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--bg-node);
            border-radius: 8px;
            box-shadow: var(--shadow);
            transition: all var(--transition-fast);
            white-space: nowrap;
            user-select: none;
            border: 1px solid transparent;
        }

        .node:hover .node-content {
            background: var(--bg-node-hover);
            box-shadow: var(--shadow-hover);
            transform: translateY(-1px);
        }

        .node.root .node-content {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            padding: 14px 24px;
            font-size: 1.125rem;
            font-weight: 600;
            border-radius: 10px;
        }

        .node.expanded .node-content {
            border-color: var(--accent-green);
        }

        .node.leaf .node-content {
            background: linear-gradient(135deg, var(--accent-green) 0%, #2f855a 100%);
        }

        .node-label {
            font-size: 0.9375rem;
            color: var(--text-primary);
            font-weight: 500;
        }

        .node.leaf .node-label {
            font-weight: 400;
        }

        /* Expand/Collapse Toggle */
        .node-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            margin-left: 8px;
            background: var(--bg-node-collapsed);
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }

        .node:hover .node-toggle {
            background: var(--accent-blue);
            color: white;
        }

        .node.expanded .node-toggle {
            background: var(--accent-green);
            color: white;
            transform: rotate(90deg);
        }

        .node.leaf .node-toggle {
            display: none;
        }

        /* Zoom Controls */
        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 50;
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1.25rem;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .zoom-btn:hover {
            background: var(--bg-node-hover);
        }

        .zoom-level {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            padding: 4px;
        }

        /* Toggle Editor Button */
        .toggle-editor {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 50;
        }

        /* Stats */
        .stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            z-index: 50;
            display: flex;
            gap: 16px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Search */
        .search-container {
            position: absolute;
            top: 70px;
            right: 20px;
            z-index: 50;
        }

        .search-input {
            width: 200px;
            padding: 8px 12px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.875rem;
            outline: none;
            transition: all var(--transition-fast);
        }

        .search-input:focus {
            border-color: var(--accent-blue);
            width: 250px;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        /* Highlight */
        .node.highlighted .node-content {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.3);
        }

        /* Context Menu */
        .context-menu {
            position: fixed;
            background: var(--bg-secondary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 8px 0;
            min-width: 160px;
            box-shadow: var(--shadow-hover);
            z-index: 200;
            display: none;
        }

        .context-menu.visible {
            display: block;
        }

        .context-menu-item {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.875rem;
            color: var(--text-primary);
            transition: background var(--transition-fast);
        }

        .context-menu-item:hover {
            background: var(--bg-node-hover);
        }

        /* Minimap */
        .minimap {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 200px;
            height: 150px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            overflow: hidden;
            z-index: 50;
        }

        .minimap-content {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .minimap-viewport {
            position: absolute;
            border: 2px solid var(--accent-blue);
            background: rgba(66, 153, 225, 0.1);
            pointer-events: none;
        }

        /* Animations */
        @keyframes nodeAppear {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .node.appearing {
            animation: nodeAppear 0.3s ease forwards;
        }

        /* Resizer */
        .resizer {
            position: absolute;
            right: 0;
            top: 0;
            width: 4px;
            height: 100%;
            cursor: col-resize;
            background: transparent;
            transition: background var(--transition-fast);
        }

        .resizer:hover {
            background: var(--accent-blue);
        }

        /* Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1rem;
            color: var(--text-secondary);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: var(--shadow-hover);
            z-index: 300;
            transition: transform var(--transition-normal);
        }

        .toast.visible {
            transform: translateX(-50%) translateY(0);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .editor-panel {
                position: absolute;
                left: 0;
                top: 0;
                height: 100%;
                z-index: 100;
                width: 100%;
                max-width: 100%;
            }

            .minimap {
                display: none;
            }

            .stats {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>Expandable Mind Map</h1>
            <div class="header-controls">
                <button class="btn" onclick="expandAll()">
                    <span>Expand All</span>
                </button>
                <button class="btn" onclick="collapseAll()">
                    <span>Collapse All</span>
                </button>
                <button class="btn" onclick="centerView()">
                    <span>Center</span>
                </button>
                <button class="btn btn-primary" onclick="exportImage()">
                    <span>Export PNG</span>
                </button>
            </div>
        </header>

        <main class="main-content">
            <aside class="editor-panel" id="editor-panel">
                <div class="resizer" id="resizer"></div>
                <div class="editor-header">
                    <h2>Mermaid Input</h2>
                </div>
                <div class="editor-content">
                    <textarea id="mermaid-input" placeholder="Enter Mermaid mindmap syntax...

Example:
mindmap
  root((Project Overview))
    Overview
    Features
      Feature A
      Feature B
    Technologies Used
      Flask
      React
      PostgreSQL
    Installation
    Usage">mindmap
  root((Gemini Astra Prototype Overview))
    Overview
    Features
      Real-time Voice Interaction
      Multi-modal Input Support
      Screen Sharing Capability
      Intelligent Response Generation
    Technologies Used
      Flask
      Flask-SocketIO
      Google Generative AI
      Eleven Labs TTS
      PIL Pillow
      Pydub
      SpeechRecognition
      Socket.IO
    Installation
      Clone Repository
      Install Dependencies
      Configure API Keys
      Run Server
    Usage
      Start Application
      Configure Settings
      Begin Interaction
    Logging
      Console Output
      File Logging
      Error Tracking</textarea>
                </div>
                <div class="editor-actions">
                    <button class="btn btn-primary" onclick="renderMindmap()" style="flex:1">
                        Render Mind Map
                    </button>
                </div>
            </aside>

            <div class="canvas-container" id="canvas-container">
                <button class="btn toggle-editor" onclick="toggleEditor()">
                    <span id="toggle-text">Hide Editor</span>
                </button>

                <div class="stats" id="stats">
                    <div class="stat-item">
                        <span>Nodes:</span>
                        <span class="stat-value" id="node-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span>Visible:</span>
                        <span class="stat-value" id="visible-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span>Depth:</span>
                        <span class="stat-value" id="depth-count">0</span>
                    </div>
                </div>

                <div class="search-container">
                    <input type="text" class="search-input" id="search-input" placeholder="Search nodes... (Ctrl+F)">
                </div>

                <div class="canvas-wrapper" id="canvas-wrapper">
                    <svg class="connections-svg" id="connections-svg"></svg>
                    <div class="mindmap" id="mindmap"></div>
                </div>

                <div class="zoom-controls">
                    <button class="zoom-btn" onclick="zoomIn()">+</button>
                    <div class="zoom-level" id="zoom-level">100%</div>
                    <button class="zoom-btn" onclick="zoomOut()">-</button>
                    <button class="zoom-btn" onclick="resetZoom()" style="font-size:0.75rem">Reset</button>
                </div>

                <div class="minimap" id="minimap">
                    <div class="minimap-content" id="minimap-content"></div>
                </div>
            </div>
        </main>
    </div>

    <div class="context-menu" id="context-menu">
        <div class="context-menu-item" onclick="expandNode(contextNode)">Expand</div>
        <div class="context-menu-item" onclick="collapseNode(contextNode)">Collapse</div>
        <div class="context-menu-item" onclick="expandChildren(contextNode)">Expand Children</div>
        <div class="context-menu-item" onclick="collapseChildren(contextNode)">Collapse Children</div>
        <div class="context-menu-item" onclick="focusNode(contextNode)">Focus</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ==================== State ====================
        let treeData = null;
        let nodeElements = new Map();
        let nodePositions = new Map();
        let expandedNodes = new Set();
        let contextNode = null;

        // View state
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let panStart = { x: 0, y: 0 };

        // Layout config
        const LAYOUT = {
            nodeHeight: 44,
            nodeGap: 12,
            levelGap: 200,
            rootOffset: 100
        };

        // ==================== Mermaid Parser ====================
        function parseMermaid(text) {
            const lines = text.split('\n');
            let root = null;
            const stack = [];
            let lastDepth = -1;

            for (let line of lines) {
                // Skip empty lines and the 'mindmap' keyword
                if (!line.trim() || line.trim() === 'mindmap') continue;

                // Calculate indentation depth
                const indent = line.search(/\S/);
                const depth = Math.floor(indent / 2);

                // Extract node text
                let content = line.trim();

                // Handle different node formats
                // root((text)) - root node
                // ((text)) - rounded rectangle
                // (text) - rounded
                // [text] - square
                // {{text}} - hexagon
                // ))text(( - cloud
                // Just text - default

                let label = content;
                let isRoot = false;

                if (content.startsWith('root((') && content.endsWith('))')) {
                    label = content.slice(6, -2);
                    isRoot = true;
                } else if (content.startsWith('((') && content.endsWith('))')) {
                    label = content.slice(2, -2);
                } else if (content.startsWith('(') && content.endsWith(')')) {
                    label = content.slice(1, -1);
                } else if (content.startsWith('[') && content.endsWith(']')) {
                    label = content.slice(1, -1);
                } else if (content.startsWith('{{') && content.endsWith('}}')) {
                    label = content.slice(2, -2);
                }

                const node = {
                    id: generateId(),
                    label: label,
                    children: [],
                    depth: depth,
                    isRoot: isRoot
                };

                if (isRoot || depth === 0 || !root) {
                    root = node;
                    stack.length = 0;
                    stack.push(node);
                } else {
                    // Find parent based on depth
                    while (stack.length > depth) {
                        stack.pop();
                    }

                    const parent = stack[stack.length - 1];
                    if (parent) {
                        parent.children.push(node);
                    }
                    stack.push(node);
                }

                lastDepth = depth;
            }

            return root;
        }

        function generateId() {
            return 'node_' + Math.random().toString(36).substr(2, 9);
        }

        // ==================== Layout Engine ====================
        function calculateLayout(node, depth = 0, yOffset = 0) {
            node._depth = depth;
            node._visible = true;

            // Calculate subtree height
            let subtreeHeight = 0;
            const visibleChildren = node.children.filter(child => {
                if (!expandedNodes.has(node.id) && depth > 0) {
                    child._visible = false;
                    return false;
                }
                return true;
            });

            if (visibleChildren.length > 0 && (expandedNodes.has(node.id) || depth === 0)) {
                for (let i = 0; i < visibleChildren.length; i++) {
                    const childHeight = calculateLayout(
                        visibleChildren[i],
                        depth + 1,
                        yOffset + subtreeHeight
                    );
                    subtreeHeight += childHeight;
                    if (i < visibleChildren.length - 1) {
                        subtreeHeight += LAYOUT.nodeGap;
                    }
                }
            }

            const nodeHeight = Math.max(LAYOUT.nodeHeight, subtreeHeight);

            // Position this node
            const x = depth * LAYOUT.levelGap;
            const y = yOffset + (subtreeHeight > 0 ? subtreeHeight / 2 : LAYOUT.nodeHeight / 2);

            node._x = x;
            node._y = y;
            node._subtreeHeight = Math.max(LAYOUT.nodeHeight, subtreeHeight);

            nodePositions.set(node.id, { x, y, node });

            return node._subtreeHeight;
        }

        // ==================== Rendering ====================
        function renderMindmap() {
            const input = document.getElementById('mermaid-input').value;
            treeData = parseMermaid(input);

            if (!treeData) {
                showToast('Invalid mindmap syntax');
                return;
            }

            // Initialize all nodes as expanded
            initExpandedNodes(treeData);

            // Render
            updateLayout();
            updateStats();
            centerView();
            showToast('Mind map rendered successfully');
        }

        function initExpandedNodes(node) {
            expandedNodes.add(node.id);
            for (const child of node.children) {
                initExpandedNodes(child);
            }
        }

        function updateLayout() {
            if (!treeData) return;

            // Calculate layout
            calculateLayout(treeData);

            // Render nodes
            renderNodes();

            // Render connections
            renderConnections();

            // Update minimap
            updateMinimap();
        }

        function renderNodes() {
            const container = document.getElementById('mindmap');
            container.innerHTML = '';
            nodeElements.clear();

            function renderNode(node) {
                if (!node._visible) return;

                const el = document.createElement('div');
                el.className = 'node';
                el.id = node.id;

                if (node._depth === 0) el.classList.add('root');
                if (node.children.length === 0) el.classList.add('leaf');
                if (expandedNodes.has(node.id) && node.children.length > 0) {
                    el.classList.add('expanded');
                }

                el.style.left = `${node._x}px`;
                el.style.top = `${node._y}px`;
                el.style.transform = 'translateY(-50%)';

                const hasChildren = node.children.length > 0;

                el.innerHTML = `
                    <div class="node-content">
                        <span class="node-label">${escapeHtml(node.label)}</span>
                    </div>
                    ${hasChildren ? `<div class="node-toggle">›</div>` : ''}
                `;

                // Event handlers
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (hasChildren) {
                        toggleNode(node);
                    }
                });

                el.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    showContextMenu(e, node);
                });

                container.appendChild(el);
                nodeElements.set(node.id, el);

                // Render children
                if (expandedNodes.has(node.id) || node._depth === 0) {
                    for (const child of node.children) {
                        renderNode(child);
                    }
                }
            }

            renderNode(treeData);
        }

        function renderConnections() {
            const svg = document.getElementById('connections-svg');
            svg.innerHTML = '';

            function renderConnection(parent, child) {
                if (!parent._visible || !child._visible) return;

                const parentEl = nodeElements.get(parent.id);
                const childEl = nodeElements.get(child.id);

                if (!parentEl || !childEl) return;

                const parentRect = parentEl.querySelector('.node-content').getBoundingClientRect();
                const childRect = childEl.querySelector('.node-content').getBoundingClientRect();

                // Get positions relative to mindmap container
                const container = document.getElementById('mindmap');
                const containerRect = container.getBoundingClientRect();

                const x1 = parent._x + parentEl.querySelector('.node-content').offsetWidth;
                const y1 = parent._y;
                const x2 = child._x;
                const y2 = child._y;

                // Create bezier curve path
                const midX = (x1 + x2) / 2;
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`);
                path.setAttribute('class', 'connection-line');

                if (expandedNodes.has(child.id)) {
                    path.classList.add('active');
                }

                svg.appendChild(path);
            }

            function traverse(node) {
                if (!node._visible) return;

                if (expandedNodes.has(node.id) || node._depth === 0) {
                    for (const child of node.children) {
                        if (child._visible) {
                            renderConnection(node, child);
                            traverse(child);
                        }
                    }
                }
            }

            traverse(treeData);
        }

        // ==================== Node Operations ====================
        function toggleNode(node) {
            if (expandedNodes.has(node.id)) {
                collapseNode(node);
            } else {
                expandNode(node);
            }
        }

        function expandNode(node) {
            if (!node) return;
            expandedNodes.add(node.id);
            updateLayout();
            updateStats();
        }

        function collapseNode(node) {
            if (!node || node._depth === 0) return;
            expandedNodes.delete(node.id);
            // Also collapse all descendants
            collapseDescendants(node);
            updateLayout();
            updateStats();
        }

        function collapseDescendants(node) {
            for (const child of node.children) {
                expandedNodes.delete(child.id);
                collapseDescendants(child);
            }
        }

        function expandChildren(node) {
            if (!node) return;
            expandedNodes.add(node.id);
            for (const child of node.children) {
                expandedNodes.add(child.id);
            }
            updateLayout();
            updateStats();
        }

        function collapseChildren(node) {
            if (!node) return;
            for (const child of node.children) {
                expandedNodes.delete(child.id);
                collapseDescendants(child);
            }
            updateLayout();
            updateStats();
        }

        function expandAll() {
            if (!treeData) return;
            function expand(node) {
                expandedNodes.add(node.id);
                for (const child of node.children) {
                    expand(child);
                }
            }
            expand(treeData);
            updateLayout();
            updateStats();
            showToast('All nodes expanded');
        }

        function collapseAll() {
            if (!treeData) return;
            expandedNodes.clear();
            expandedNodes.add(treeData.id); // Keep root expanded
            updateLayout();
            updateStats();
            showToast('All nodes collapsed');
        }

        function focusNode(node) {
            if (!node) return;
            const wrapper = document.getElementById('canvas-wrapper');
            const container = document.getElementById('canvas-container');

            const containerRect = container.getBoundingClientRect();
            const targetX = containerRect.width / 2 - node._x * scale - 100;
            const targetY = containerRect.height / 2 - node._y * scale;

            panX = targetX;
            panY = targetY;
            updateTransform();
        }

        // ==================== View Controls ====================
        function zoomIn() {
            scale = Math.min(scale * 1.2, 3);
            updateTransform();
        }

        function zoomOut() {
            scale = Math.max(scale / 1.2, 0.3);
            updateTransform();
        }

        function resetZoom() {
            scale = 1;
            panX = 0;
            panY = 0;
            updateTransform();
        }

        function centerView() {
            if (!treeData) return;
            const container = document.getElementById('canvas-container');
            const containerRect = container.getBoundingClientRect();

            // Calculate bounds
            let minY = Infinity, maxY = -Infinity;
            nodePositions.forEach(({ y }) => {
                minY = Math.min(minY, y);
                maxY = Math.max(maxY, y);
            });

            const centerY = (minY + maxY) / 2;
            panX = 80;
            panY = containerRect.height / 2 - centerY * scale;
            updateTransform();
        }

        function updateTransform() {
            const wrapper = document.getElementById('canvas-wrapper');
            wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            document.getElementById('zoom-level').textContent = `${Math.round(scale * 100)}%`;
            updateMinimap();
        }

        // ==================== Pan & Zoom ====================
        function initPanZoom() {
            const container = document.getElementById('canvas-container');

            container.addEventListener('mousedown', (e) => {
                if (e.target === container || e.target.id === 'canvas-wrapper' || e.target.tagName === 'svg') {
                    isDragging = true;
                    dragStart = { x: e.clientX, y: e.clientY };
                    panStart = { x: panX, y: panY };
                    container.style.cursor = 'grabbing';
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    panX = panStart.x + (e.clientX - dragStart.x);
                    panY = panStart.y + (e.clientY - dragStart.y);
                    updateTransform();
                }
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                container.style.cursor = '';
            });

            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                const newScale = Math.max(0.3, Math.min(3, scale * delta));

                // Zoom towards cursor
                const rect = container.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const scaleRatio = newScale / scale;
                panX = mouseX - (mouseX - panX) * scaleRatio;
                panY = mouseY - (mouseY - panY) * scaleRatio;

                scale = newScale;
                updateTransform();
            }, { passive: false });
        }

        // ==================== Editor ====================
        function toggleEditor() {
            const panel = document.getElementById('editor-panel');
            const btn = document.getElementById('toggle-text');
            panel.classList.toggle('collapsed');
            btn.textContent = panel.classList.contains('collapsed') ? 'Show Editor' : 'Hide Editor';
        }

        function initResizer() {
            const resizer = document.getElementById('resizer');
            const panel = document.getElementById('editor-panel');
            let isResizing = false;

            resizer.addEventListener('mousedown', (e) => {
                isResizing = true;
                document.body.style.cursor = 'col-resize';
            });

            window.addEventListener('mousemove', (e) => {
                if (isResizing) {
                    const newWidth = e.clientX;
                    if (newWidth >= 200 && newWidth <= 800) {
                        panel.style.width = `${newWidth}px`;
                    }
                }
            });

            window.addEventListener('mouseup', () => {
                isResizing = false;
                document.body.style.cursor = '';
            });
        }

        // ==================== Search ====================
        function initSearch() {
            const input = document.getElementById('search-input');

            input.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                highlightSearch(query);
            });

            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                    e.preventDefault();
                    input.focus();
                    input.select();
                }
            });
        }

        function highlightSearch(query) {
            nodeElements.forEach((el, id) => {
                el.classList.remove('highlighted');
                if (query && el.querySelector('.node-label').textContent.toLowerCase().includes(query)) {
                    el.classList.add('highlighted');
                }
            });
        }

        // ==================== Context Menu ====================
        function showContextMenu(e, node) {
            contextNode = node;
            const menu = document.getElementById('context-menu');
            menu.style.left = `${e.clientX}px`;
            menu.style.top = `${e.clientY}px`;
            menu.classList.add('visible');
        }

        function hideContextMenu() {
            document.getElementById('context-menu').classList.remove('visible');
            contextNode = null;
        }

        // ==================== Minimap ====================
        function updateMinimap() {
            if (!treeData) return;

            const minimapContent = document.getElementById('minimap-content');
            const container = document.getElementById('canvas-container');
            const containerRect = container.getBoundingClientRect();

            // Calculate bounds
            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;

            nodePositions.forEach(({ x, y }) => {
                minX = Math.min(minX, x);
                maxX = Math.max(maxX, x + 200);
                minY = Math.min(minY, y);
                maxY = Math.max(maxY, y);
            });

            const contentWidth = maxX - minX + 100;
            const contentHeight = maxY - minY + 100;
            const minimapScale = Math.min(200 / contentWidth, 150 / contentHeight) * 0.8;

            // Render minimap nodes
            minimapContent.innerHTML = '';

            nodePositions.forEach(({ x, y, node }) => {
                if (!node._visible) return;
                const dot = document.createElement('div');
                dot.style.cssText = `
                    position: absolute;
                    width: 6px;
                    height: 6px;
                    background: ${node._depth === 0 ? '#68d391' : node.children.length === 0 ? '#48bb78' : '#4a5568'};
                    border-radius: 50%;
                    left: ${(x - minX) * minimapScale + 10}px;
                    top: ${(y - minY) * minimapScale + 10}px;
                `;
                minimapContent.appendChild(dot);
            });

            // Viewport indicator
            const viewportDiv = document.createElement('div');
            viewportDiv.className = 'minimap-viewport';
            viewportDiv.style.cssText = `
                left: ${(-panX / scale - minX) * minimapScale + 10}px;
                top: ${(-panY / scale - minY) * minimapScale + 10}px;
                width: ${(containerRect.width / scale) * minimapScale}px;
                height: ${(containerRect.height / scale) * minimapScale}px;
            `;
            minimapContent.appendChild(viewportDiv);
        }

        // ==================== Stats ====================
        function updateStats() {
            if (!treeData) return;

            let total = 0;
            let visible = 0;
            let maxDepth = 0;

            function count(node, depth) {
                total++;
                if (node._visible) visible++;
                maxDepth = Math.max(maxDepth, depth);
                for (const child of node.children) {
                    count(child, depth + 1);
                }
            }

            count(treeData, 0);

            document.getElementById('node-count').textContent = total;
            document.getElementById('visible-count').textContent = visible;
            document.getElementById('depth-count').textContent = maxDepth;
        }

        // ==================== Export ====================
        async function exportImage() {
            showToast('Preparing export...');

            // Use html2canvas if available, otherwise show instructions
            if (typeof html2canvas === 'undefined') {
                showToast('For PNG export, include html2canvas library');
                return;
            }

            const mindmap = document.getElementById('mindmap');
            const canvas = await html2canvas(mindmap, {
                backgroundColor: '#1a1d23',
                scale: 2
            });

            const link = document.createElement('a');
            link.download = 'mindmap.png';
            link.href = canvas.toDataURL();
            link.click();

            showToast('Image exported!');
        }

        // ==================== Toast ====================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 2000);
        }

        // ==================== Utilities ====================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== Keyboard Shortcuts ====================
        function initKeyboard() {
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

                switch(e.key) {
                    case '+':
                    case '=':
                        zoomIn();
                        break;
                    case '-':
                        zoomOut();
                        break;
                    case '0':
                        resetZoom();
                        break;
                    case 'c':
                        centerView();
                        break;
                    case 'e':
                        expandAll();
                        break;
                    case 'w':
                        collapseAll();
                        break;
                }
            });
        }

        // ==================== Initialize ====================
        document.addEventListener('DOMContentLoaded', () => {
            initPanZoom();
            initResizer();
            initSearch();
            initKeyboard();

            // Close context menu on click
            document.addEventListener('click', hideContextMenu);

            // Auto-render on load
            setTimeout(renderMindmap, 100);
        });

        // Expose functions globally
        window.renderMindmap = renderMindmap;
        window.expandAll = expandAll;
        window.collapseAll = collapseAll;
        window.centerView = centerView;
        window.toggleEditor = toggleEditor;
        window.zoomIn = zoomIn;
        window.zoomOut = zoomOut;
        window.resetZoom = resetZoom;
        window.exportImage = exportImage;
        window.expandNode = expandNode;
        window.collapseNode = collapseNode;
        window.expandChildren = expandChildren;
        window.collapseChildren = collapseChildren;
        window.focusNode = focusNode;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f1419">
    <title>Mind Map Pro</title>
    <style>
        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #192734;
            --bg-tertiary: #22303c;
            --bg-card: #1c2732;
            --text-primary: #ffffff;
            --text-secondary: #8899a6;
            --text-muted: #5c6e7e;
            --accent-primary: #1d9bf0;
            --accent-success: #00ba7c;
            --accent-warning: #ffad1f;
            --accent-danger: #f4212e;
            --accent-purple: #7856ff;
            --line-color: #38444d;
            --line-active: #1d9bf0;
            --depth-0: #1d9bf0;
            --depth-1: #00ba7c;
            --depth-2: #7856ff;
            --depth-3: #ffad1f;
            --depth-4: #f4212e;
            --depth-5: #ff6b9d;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.5);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.6);
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            --transition: 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; overflow: hidden; touch-action: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; background: var(--bg-primary); color: var(--text-primary); font-size: 14px; }

        .app { display: flex; flex-direction: column; height: 100dvh; }

        /* Header */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; padding-top: calc(8px + var(--safe-top));
            background: var(--bg-secondary); border-bottom: 1px solid var(--line-color);
            z-index: 100; flex-shrink: 0; gap: 8px;
        }
        .header-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
        .logo { font-size: 18px; flex-shrink: 0; }
        .breadcrumb {
            display: flex; align-items: center; gap: 4px; font-size: 12px;
            color: var(--text-secondary); overflow: hidden; min-width: 0;
        }
        .breadcrumb-item {
            white-space: nowrap; cursor: pointer; padding: 4px 8px;
            background: var(--bg-tertiary); border-radius: var(--radius-sm);
            max-width: 120px; overflow: hidden; text-overflow: ellipsis;
            transition: all var(--transition);
        }
        .breadcrumb-item:hover { background: var(--bg-card); color: var(--text-primary); }
        .breadcrumb-sep { color: var(--text-muted); flex-shrink: 0; }
        .header-actions { display: flex; gap: 4px; flex-shrink: 0; }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 8px 12px; min-height: 36px; min-width: 36px;
            background: var(--bg-tertiary); color: var(--text-primary);
            border: 1px solid var(--line-color); border-radius: var(--radius-md);
            font-size: 13px; font-weight: 500; cursor: pointer;
            transition: all var(--transition); white-space: nowrap;
        }
        .btn:active { transform: scale(0.96); }
        .btn:hover { background: var(--bg-card); border-color: var(--text-muted); }
        .btn-icon { padding: 8px; font-size: 16px; }
        .btn-primary { background: var(--accent-primary); border-color: var(--accent-primary); }
        .btn-primary:hover { background: #1a8cd8; }
        .btn-success { background: var(--accent-success); border-color: var(--accent-success); }
        .btn-sm { min-height: 32px; min-width: 32px; padding: 6px 10px; font-size: 12px; }

        /* Canvas */
        .canvas-container {
            flex: 1; position: relative; overflow: hidden; background: var(--bg-primary);
            background-image: radial-gradient(circle at 1px 1px, var(--line-color) 1px, transparent 0);
            background-size: 24px 24px;
        }
        .canvas-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform-origin: 0 0; will-change: transform;
        }

        /* SVG */
        .connections-svg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; overflow: visible;
        }
        .connection-line {
            fill: none; stroke: var(--line-color); stroke-width: 2;
            stroke-linecap: round; opacity: 0.6;
            transition: stroke 0.3s, opacity 0.3s, stroke-width 0.3s;
        }
        .connection-line.highlighted { stroke: var(--accent-primary); stroke-width: 3; opacity: 1; }

        /* Mindmap */
        .mindmap { position: absolute; top: 50%; left: 50px; }

        /* Nodes */
        .node {
            position: absolute; display: flex; align-items: center;
            cursor: pointer; transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform, opacity;
        }
        .node.hidden { opacity: 0; pointer-events: none; transform: translateX(-20px) translateY(-50%); }

        .node-wrapper { position: relative; display: flex; align-items: center; }

        .depth-indicator {
            position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
            width: 4px; height: 70%; border-radius: 2px;
            transition: all var(--transition);
        }

        .node-content {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 14px; background: var(--bg-card);
            border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
            border: 2px solid transparent; transition: all var(--transition);
            user-select: none; -webkit-user-select: none; position: relative;
        }
        .node:hover .node-content { box-shadow: var(--shadow-md); transform: translateY(-1px); }
        .node:active .node-content { transform: scale(0.98); }

        .node.root .node-content {
            background: linear-gradient(135deg, var(--accent-primary) 0%, #0d6ebd 100%);
            padding: 14px 20px; border-radius: var(--radius-lg);
        }
        .node.root .node-label { font-size: 16px; font-weight: 700; }
        .node.root .depth-indicator { display: none; }

        .node.expanded .node-content { border-color: var(--accent-primary); }
        .node.selected .node-content { border-color: var(--accent-warning); box-shadow: 0 0 0 3px rgba(255,173,31,0.3); }
        .node.highlighted .node-content { border-color: var(--accent-success); box-shadow: 0 0 0 3px rgba(0,186,124,0.3); }

        .node.leaf .node-content { background: var(--bg-tertiary); }

        .node-label {
            font-size: 14px; color: var(--text-primary); font-weight: 500;
            white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis;
        }

        /* Toggle */
        .node-toggle {
            display: flex; align-items: center; justify-content: center;
            width: 24px; height: 24px; margin-left: 6px;
            background: var(--bg-secondary); border-radius: var(--radius-sm);
            font-size: 14px; color: var(--text-secondary);
            transition: all var(--transition); flex-shrink: 0;
        }
        .node-toggle svg { width: 12px; height: 12px; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .node.expanded .node-toggle { background: var(--accent-primary); color: white; }
        .node.expanded .node-toggle svg { transform: rotate(90deg); }
        .node.leaf .node-toggle { display: none; }

        /* Badge */
        .node-badge {
            position: absolute; top: -8px; right: -8px;
            min-width: 20px; height: 20px; padding: 0 6px;
            background: var(--accent-warning); color: var(--bg-primary);
            border-radius: var(--radius-full); font-size: 11px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transform: scale(0.5);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .node:not(.expanded):not(.leaf) .node-badge { opacity: 1; transform: scale(1); }

        /* Tooltip */
        .tooltip {
            position: fixed; background: var(--bg-card); color: var(--text-primary);
            padding: 8px 12px; border-radius: var(--radius-md); font-size: 13px;
            box-shadow: var(--shadow-lg); z-index: 1000; pointer-events: none;
            max-width: 300px; word-wrap: break-word;
            opacity: 0; transform: translateY(4px);
            transition: all 0.2s ease;
        }
        .tooltip.visible { opacity: 1; transform: translateY(0); }
        .tooltip-path { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

        /* Search Panel */
        .search-panel {
            position: absolute; top: 12px; right: 12px; z-index: 60;
            display: flex; flex-direction: column; gap: 8px;
        }
        .search-box {
            display: flex; align-items: center; gap: 8px;
            background: var(--bg-secondary); border: 1px solid var(--line-color);
            border-radius: var(--radius-md); padding: 4px 8px;
            transition: all var(--transition);
        }
        .search-box:focus-within { border-color: var(--accent-primary); }
        .search-box svg { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; }
        .search-input {
            flex: 1; background: none; border: none; color: var(--text-primary);
            font-size: 13px; outline: none; min-width: 150px;
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-results {
            background: var(--bg-secondary); border: 1px solid var(--line-color);
            border-radius: var(--radius-md); max-height: 200px; overflow-y: auto;
            display: none;
        }
        .search-results.visible { display: block; }
        .search-result-item {
            padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--line-color);
            transition: background var(--transition);
        }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:hover { background: var(--bg-tertiary); }
        .search-result-label { font-weight: 500; }
        .search-result-path { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .search-count { font-size: 11px; color: var(--text-muted); padding: 4px 8px; text-align: center; }

        /* Bottom Toolbar */
        .bottom-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; padding-bottom: calc(8px + var(--safe-bottom));
            background: var(--bg-secondary); border-top: 1px solid var(--line-color);
            gap: 8px; flex-shrink: 0;
        }
        .toolbar-group { display: flex; gap: 4px; align-items: center; }
        .toolbar-divider { width: 1px; height: 24px; background: var(--line-color); margin: 0 4px; }
        .zoom-display {
            font-size: 12px; color: var(--text-secondary);
            min-width: 45px; text-align: center;
        }
        .depth-legend {
            display: flex; gap: 4px; align-items: center;
        }
        .depth-dot {
            width: 8px; height: 8px; border-radius: 50%;
        }

        /* History buttons */
        .btn.disabled { opacity: 0.4; pointer-events: none; }

        /* Floating Info */
        .info-panel {
            position: absolute; bottom: 70px; left: 12px;
            background: var(--bg-secondary); border: 1px solid var(--line-color);
            border-radius: var(--radius-md); padding: 12px; font-size: 12px;
            z-index: 50; min-width: 140px;
        }
        .info-row { display: flex; justify-content: space-between; padding: 4px 0; }
        .info-label { color: var(--text-muted); }
        .info-value { color: var(--text-primary); font-weight: 600; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 200; opacity: 0; visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.visible { opacity: 1; visibility: visible; }
        .modal {
            position: fixed; bottom: 0; left: 0; right: 0;
            max-height: 80vh; background: var(--bg-secondary);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; flex-direction: column;
            padding-bottom: var(--safe-bottom);
        }
        .modal-overlay.visible .modal { transform: translateY(0); }
        .modal-handle { width: 40px; height: 4px; background: var(--text-muted); border-radius: 2px; margin: 12px auto; }
        .modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px 12px; border-bottom: 1px solid var(--line-color);
        }
        .modal-title { font-size: 16px; font-weight: 600; }
        .modal-body { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        .editor-textarea {
            flex: 1; width: 100%; padding: 16px; background: var(--bg-primary);
            color: var(--text-primary); border: none;
            font-family: 'SF Mono', Monaco, Consolas, monospace;
            font-size: 13px; line-height: 1.6; resize: none; outline: none;
            min-height: 200px;
        }
        .modal-footer {
            padding: 12px 16px; border-top: 1px solid var(--line-color);
            display: flex; gap: 8px;
        }
        .modal-footer .btn { flex: 1; }

        /* Context Menu */
        .context-menu {
            position: fixed; background: var(--bg-secondary);
            border: 1px solid var(--line-color); border-radius: var(--radius-md);
            padding: 6px 0; min-width: 180px; box-shadow: var(--shadow-lg);
            z-index: 200; opacity: 0; visibility: hidden;
            transform: scale(0.95); transition: all 0.15s ease;
        }
        .context-menu.visible { opacity: 1; visibility: visible; transform: scale(1); }
        .context-menu-item {
            padding: 10px 14px; cursor: pointer; font-size: 13px;
            display: flex; align-items: center; gap: 10px;
            transition: background var(--transition);
        }
        .context-menu-item:hover { background: var(--bg-tertiary); }
        .context-menu-item svg { width: 16px; height: 16px; color: var(--text-secondary); }
        .context-menu-divider { height: 1px; background: var(--line-color); margin: 6px 0; }

        /* Toast */
        .toast {
            position: fixed; bottom: 100px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card); color: var(--text-primary);
            padding: 12px 20px; border-radius: var(--radius-full);
            box-shadow: var(--shadow-lg); z-index: 300;
            opacity: 0; visibility: hidden; transition: all 0.3s ease;
            font-size: 13px; display: flex; align-items: center; gap: 8px;
        }
        .toast.visible { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--accent-success); }
        .toast.error { background: var(--accent-danger); }

        /* Responsive */
        @media (min-width: 769px) {
            .modal {
                top: 50%; left: 50%; right: auto; bottom: auto;
                transform: translate(-50%, -50%) scale(0.95);
                width: 600px; max-height: 70vh; border-radius: var(--radius-lg);
                padding-bottom: 0;
            }
            .modal-overlay.visible .modal { transform: translate(-50%, -50%) scale(1); }
            .modal-handle { display: none; }
            .search-input { min-width: 200px; }
            .node-label { max-width: 250px; }
            .info-panel { min-width: 160px; }
        }

        @media (max-width: 768px) {
            .header { padding: 6px 10px; padding-top: calc(6px + var(--safe-top)); }
            .breadcrumb { display: none; }
            .search-panel { top: 8px; right: 8px; left: 8px; }
            .search-input { min-width: 0; }
            .info-panel { display: none; }
            .btn span.label { display: none; }
            .depth-legend { display: none; }
        }

        @media (max-width: 380px) {
            .toolbar-group .btn:not(.btn-icon) span { display: none; }
        }

        /* Animations */
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .loading { animation: pulse 1.5s ease-in-out infinite; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <span class="logo">🧠</span>
                <nav class="breadcrumb" id="breadcrumb"></nav>
            </div>
            <div class="header-actions">
                <button class="btn btn-icon" onclick="undo()" id="btn-undo" title="Undo (Ctrl+Z)">↶</button>
                <button class="btn btn-icon" onclick="redo()" id="btn-redo" title="Redo (Ctrl+Y)">↷</button>
                <button class="btn btn-icon" onclick="showEditor()" title="Edit">✎</button>
            </div>
        </header>

        <!-- Canvas -->
        <div class="canvas-container" id="canvas-container">
            <div class="canvas-wrapper" id="canvas-wrapper">
                <svg class="connections-svg" id="connections-svg"></svg>
                <div class="mindmap" id="mindmap"></div>
            </div>

            <!-- Search -->
            <div class="search-panel">
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" class="search-input" id="search-input" placeholder="Search...">
                </div>
                <div class="search-results" id="search-results"></div>
            </div>

            <!-- Info Panel -->
            <div class="info-panel" id="info-panel">
                <div class="info-row">
                    <span class="info-label">Total</span>
                    <span class="info-value" id="stat-total">0</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Visible</span>
                    <span class="info-value" id="stat-visible">0</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Depth</span>
                    <span class="info-value" id="stat-depth">0</span>
                </div>
            </div>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <div class="toolbar-group">
                <button class="btn btn-sm" onclick="expandAll()">⊕ <span class="label">Expand</span></button>
                <button class="btn btn-sm" onclick="collapseAll()">⊖ <span class="label">Collapse</span></button>
            </div>
            <div class="toolbar-group">
                <div class="depth-legend">
                    <div class="depth-dot" style="background:var(--depth-1)"></div>
                    <div class="depth-dot" style="background:var(--depth-2)"></div>
                    <div class="depth-dot" style="background:var(--depth-3)"></div>
                    <div class="depth-dot" style="background:var(--depth-4)"></div>
                </div>
            </div>
            <div class="toolbar-group">
                <button class="btn btn-sm btn-icon" onclick="zoomOut()">−</button>
                <span class="zoom-display" id="zoom-level">100%</span>
                <button class="btn btn-sm btn-icon" onclick="zoomIn()">+</button>
                <div class="toolbar-divider"></div>
                <button class="btn btn-sm btn-icon" onclick="fitToScreen()">⤢</button>
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip"></div>

    <!-- Editor Modal -->
    <div class="modal-overlay" id="editor-modal" onclick="handleModalClick(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-handle"></div>
            <div class="modal-header">
                <span class="modal-title">Mermaid Editor</span>
                <button class="btn btn-icon btn-sm" onclick="hideEditor()">✕</button>
            </div>
            <div class="modal-body">
                <textarea class="editor-textarea" id="mermaid-input" placeholder="mindmap
  root((Title))
    Node 1
      Child 1
      Child 2
    Node 2"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="loadSample()">Sample</button>
                <button class="btn btn-primary" onclick="renderAndClose()">Render</button>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div class="context-menu" id="context-menu">
        <div class="context-menu-item" onclick="ctxExpand()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            Expand
        </div>
        <div class="context-menu-item" onclick="ctxCollapse()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
            Collapse
        </div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item" onclick="ctxExpandAll()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
            Expand Subtree
        </div>
        <div class="context-menu-item" onclick="ctxCollapseAll()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12h8"/></svg>
            Collapse Subtree
        </div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item" onclick="ctxFocus()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
            Focus
        </div>
        <div class="context-menu-item" onclick="ctxCopyPath()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            Copy Path
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
    (function() {
        'use strict';

        // ===== State =====
        let treeData = null;
        const nodeMap = new Map();
        const nodeElements = new Map();
        const nodePositions = new Map();
        let expandedNodes = new Set();
        let selectedNode = null;
        let contextNode = null;
        let hoveredNode = null;

        // View
        let scale = 1, panX = 0, panY = 0;

        // History
        const history = [];
        let historyIndex = -1;
        const MAX_HISTORY = 50;

        // Touch
        const touch = { dragging: false, pinching: false, startX: 0, startY: 0, startPanX: 0, startPanY: 0, startScale: 1, startDist: 0, lastTap: 0, longPress: null };

        // Layout
        const LAYOUT = { nodeH: 44, gap: 14, levelGap: 160 };
        const DEPTH_COLORS = ['#1d9bf0', '#00ba7c', '#7856ff', '#ffad1f', '#f4212e', '#ff6b9d'];

        // Sample
        const SAMPLE = `mindmap
  root((AI Application Architecture))
    Frontend
      React Components
        Dashboard
        Settings Panel
        Data Visualization
      State Management
        Redux Store
        Context API
      Styling
        Tailwind CSS
        Styled Components
    Backend
      API Layer
        REST Endpoints
        GraphQL Schema
        WebSocket Handlers
      Business Logic
        Authentication
        Data Processing
        ML Integration
      Database
        PostgreSQL
        Redis Cache
        S3 Storage
    Infrastructure
      Cloud Services
        AWS Lambda
        EC2 Instances
        CloudFront CDN
      DevOps
        Docker Containers
        Kubernetes
        CI/CD Pipeline
      Monitoring
        CloudWatch
        Sentry
        DataDog
    Security
      Authentication
        OAuth 2.0
        JWT Tokens
      Encryption
        TLS/SSL
        AES-256
      Compliance
        GDPR
        SOC 2`;

        // ===== Parser =====
        function parse(text) {
            const lines = text.split('\n');
            let root = null;
            const stack = [];
            nodeMap.clear();

            for (const line of lines) {
                if (!line.trim() || line.trim() === 'mindmap') continue;
                const indent = line.search(/\S/);
                const depth = Math.floor(indent / 2);
                let content = line.trim();
                let label = content, isRoot = false;

                if (content.startsWith('root((') && content.endsWith('))')) { label = content.slice(6, -2); isRoot = true; }
                else if (content.startsWith('((') && content.endsWith('))')) label = content.slice(2, -2);
                else if (content.startsWith('(') && content.endsWith(')')) label = content.slice(1, -1);
                else if (content.startsWith('[') && content.endsWith(']')) label = content.slice(1, -1);
                else if (content.startsWith('{{') && content.endsWith('}}')) label = content.slice(2, -2);

                const node = { id: 'n' + Math.random().toString(36).slice(2, 9), label, children: [], depth, isRoot, parent: null };
                nodeMap.set(node.id, node);

                if (isRoot || depth === 0 || !root) {
                    root = node;
                    stack.length = 0;
                    stack.push(node);
                } else {
                    while (stack.length > depth) stack.pop();
                    const parent = stack[stack.length - 1];
                    if (parent) { parent.children.push(node); node.parent = parent; }
                    stack.push(node);
                }
            }
            return root;
        }

        // ===== Layout =====
        function calcLayout(node, depth = 0, yOff = 0) {
            node._depth = depth;
            node._visible = true;
            let subH = 0;
            const expanded = expandedNodes.has(node.id) || depth === 0;

            if (expanded && node.children.length) {
                node.children.forEach((child, i) => {
                    child._visible = true;
                    subH += calcLayout(child, depth + 1, yOff + subH);
                    if (i < node.children.length - 1) subH += LAYOUT.gap;
                });
            } else {
                (function hide(n) { n.children.forEach(c => { c._visible = false; hide(c); }); })(node);
            }

            node._x = depth * LAYOUT.levelGap;
            node._y = yOff + (subH > 0 ? subH / 2 : LAYOUT.nodeH / 2);
            node._subH = Math.max(LAYOUT.nodeH, subH);
            nodePositions.set(node.id, { x: node._x, y: node._y, node });
            return node._subH;
        }

        // ===== Render =====
        function render() {
            if (!treeData) return;
            nodePositions.clear();
            calcLayout(treeData);
            renderNodes();
            renderLines();
            updateStats();
            updateBreadcrumb();
            updateHistoryButtons();
        }

        function renderNodes() {
            const container = document.getElementById('mindmap');
            const existing = new Map(nodeElements);
            nodeElements.clear();

            function renderNode(node) {
                if (!node._visible) { existing.get(node.id)?.remove(); return; }

                let el = existing.get(node.id);
                const isNew = !el;
                if (isNew) {
                    el = document.createElement('div');
                    el.className = 'node';
                    container.appendChild(el);
                }

                const depthColor = DEPTH_COLORS[Math.min(node._depth, DEPTH_COLORS.length - 1)];
                const hasKids = node.children.length > 0;
                const count = countDesc(node);

                el.className = 'node' +
                    (node._depth === 0 ? ' root' : '') +
                    (!hasKids ? ' leaf' : '') +
                    (expandedNodes.has(node.id) && hasKids ? ' expanded' : '') +
                    (selectedNode === node ? ' selected' : '');

                el.style.cssText = `left:${node._x}px;top:${node._y}px;transform:translateY(-50%);`;

                el.innerHTML = `
                    <div class="node-wrapper">
                        <div class="depth-indicator" style="background:${depthColor}"></div>
                        <div class="node-content">
                            <span class="node-label">${esc(node.label)}</span>
                        </div>
                        ${hasKids ? `<div class="node-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 6l6 6-6 6"/></svg></div>` : ''}
                        ${hasKids ? `<div class="node-badge">${count}</div>` : ''}
                    </div>
                `;

                setupEvents(el, node);
                nodeElements.set(node.id, el);
                existing.delete(node.id);
                node.children.forEach(renderNode);
            }

            renderNode(treeData);
            existing.forEach(el => el.remove());
        }

        function renderLines() {
            const svg = document.getElementById('connections-svg');
            svg.innerHTML = '';

            function drawLine(p, c) {
                // Only draw line if both nodes are visible and have elements
                if (!p._visible || !c._visible) return;
                const pEl = nodeElements.get(p.id);
                const cEl = nodeElements.get(c.id);
                if (!pEl || !cEl) return;

                const x1 = p._x + pEl.querySelector('.node-content').offsetWidth;
                const y1 = p._y, x2 = c._x, y2 = c._y;
                const mx = (x1 + x2) / 2;
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
                path.setAttribute('class', 'connection-line' + (hoveredNode && (hoveredNode === c || isAncestor(hoveredNode, c)) ? ' highlighted' : ''));
                path.dataset.child = c.id;
                svg.appendChild(path);
            }

            function traverse(node) {
                // Skip if node is not visible or has no children
                if (!node._visible || node.children.length === 0) return;

                // Only draw lines to children if this node is expanded
                const isExpanded = expandedNodes.has(node.id);
                if (!isExpanded && node._depth > 0) return;

                // Draw lines only to visible children
                node.children.forEach(c => {
                    if (c._visible) {
                        drawLine(node, c);
                        traverse(c);
                    }
                });
            }

            if (treeData) traverse(treeData);
        }

        function isAncestor(node, potential) {
            let curr = node;
            while (curr) { if (curr === potential) return true; curr = curr.parent; }
            return false;
        }

        function countDesc(node) {
            let c = node.children.length;
            node.children.forEach(ch => c += countDesc(ch));
            return c;
        }

        function getPath(node) {
            const path = [];
            let curr = node;
            while (curr) { path.unshift(curr); curr = curr.parent; }
            return path;
        }

        // ===== Events =====
        function setupEvents(el, node) {
            const hasKids = node.children.length > 0;

            el.addEventListener('click', e => {
                e.stopPropagation();
                if (hasKids) { vibrate(10); toggle(node); }
                selectNode(node);
            });

            el.addEventListener('contextmenu', e => { e.preventDefault(); showCtxMenu(e, node); });

            el.addEventListener('mouseenter', () => {
                hoveredNode = node;
                renderLines();
                showTooltip(el, node);
            });

            el.addEventListener('mouseleave', () => {
                hoveredNode = null;
                renderLines();
                hideTooltip();
            });

            el.addEventListener('touchstart', e => {
                touch.longPress = setTimeout(() => { vibrate(50); showCtxMenu(e.touches[0], node); }, 500);
            }, { passive: true });

            el.addEventListener('touchend', () => clearTimeout(touch.longPress), { passive: true });
            el.addEventListener('touchmove', () => clearTimeout(touch.longPress), { passive: true });
        }

        // ===== Node Operations =====
        function saveState() {
            if (historyIndex < history.length - 1) history.splice(historyIndex + 1);
            history.push(new Set(expandedNodes));
            if (history.length > MAX_HISTORY) history.shift();
            historyIndex = history.length - 1;
            updateHistoryButtons();
        }

        function toggle(node) { expandedNodes.has(node.id) ? collapse(node) : expand(node); }

        function expand(node) {
            if (!node) return;
            saveState();
            expandedNodes.add(node.id);
            render();
        }

        function collapse(node) {
            if (!node || node._depth === 0) return;
            saveState();
            expandedNodes.delete(node.id);
            (function collapseDesc(n) { n.children.forEach(c => { expandedNodes.delete(c.id); collapseDesc(c); }); })(node);
            render();
        }

        function expandAll() {
            saveState();
            (function exp(n) { expandedNodes.add(n.id); n.children.forEach(exp); })(treeData);
            render();
            toast('All expanded');
        }

        function collapseAll() {
            saveState();
            expandedNodes.clear();
            expandedNodes.add(treeData.id);
            render();
            toast('All collapsed');
        }

        function selectNode(node) {
            selectedNode = node;
            nodeElements.forEach((el, id) => el.classList.toggle('selected', nodeMap.get(id) === node));
            updateBreadcrumb();
        }

        function focusNode(node) {
            if (!node) return;
            let curr = node.parent;
            while (curr) { expandedNodes.add(curr.id); curr = curr.parent; }
            render();
            const container = document.getElementById('canvas-container');
            const rect = container.getBoundingClientRect();
            panX = rect.width / 2 - node._x * scale - 100;
            panY = rect.height / 2 - node._y * scale;
            updateTransform();
            selectNode(node);
        }

        // ===== History =====
        function undo() {
            if (historyIndex <= 0) return;
            historyIndex--;
            expandedNodes = new Set(history[historyIndex]);
            render();
            toast('Undo');
        }

        function redo() {
            if (historyIndex >= history.length - 1) return;
            historyIndex++;
            expandedNodes = new Set(history[historyIndex]);
            render();
            toast('Redo');
        }

        function updateHistoryButtons() {
            document.getElementById('btn-undo').classList.toggle('disabled', historyIndex <= 0);
            document.getElementById('btn-redo').classList.toggle('disabled', historyIndex >= history.length - 1);
        }

        // ===== View =====
        function zoomIn() { setZoom(Math.min(scale * 1.25, 3)); vibrate(5); }
        function zoomOut() { setZoom(Math.max(scale / 1.25, 0.2)); vibrate(5); }

        function setZoom(newScale, cx, cy) {
            const container = document.getElementById('canvas-container');
            const rect = container.getBoundingClientRect();
            cx = cx ?? rect.width / 2;
            cy = cy ?? rect.height / 2;
            const ratio = newScale / scale;
            panX = cx - (cx - panX) * ratio;
            panY = cy - (cy - panY) * ratio;
            scale = newScale;
            updateTransform();
        }

        function fitToScreen() {
            if (!treeData) return;
            const container = document.getElementById('canvas-container');
            const rect = container.getBoundingClientRect();
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            nodePositions.forEach(({ x, y, node }) => {
                if (node._visible) {
                    minX = Math.min(minX, x);
                    maxX = Math.max(maxX, x + 200);
                    minY = Math.min(minY, y - 25);
                    maxY = Math.max(maxY, y + 25);
                }
            });
            const w = maxX - minX + 80, h = maxY - minY + 80;
            scale = Math.max(0.3, Math.min(1.2, Math.min(rect.width / w, rect.height / h)));
            panX = rect.width / 2 - (minX + maxX) / 2 * scale;
            panY = rect.height / 2 - (minY + maxY) / 2 * scale;
            updateTransform();
        }

        function updateTransform() {
            document.getElementById('canvas-wrapper').style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
            document.getElementById('zoom-level').textContent = Math.round(scale * 100) + '%';
        }

        // ===== Touch & Mouse =====
        function initInput() {
            const c = document.getElementById('canvas-container');

            c.addEventListener('touchstart', e => {
                if (e.touches.length === 1) {
                    touch.dragging = true;
                    touch.startX = e.touches[0].clientX;
                    touch.startY = e.touches[0].clientY;
                    touch.startPanX = panX;
                    touch.startPanY = panY;
                } else if (e.touches.length === 2) {
                    touch.dragging = false;
                    touch.pinching = true;
                    touch.startDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    touch.startScale = scale;
                    touch.pinchX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    touch.pinchY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                }
            }, { passive: true });

            c.addEventListener('touchmove', e => {
                if (touch.pinching && e.touches.length === 2) {
                    e.preventDefault();
                    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    const rect = c.getBoundingClientRect();
                    setZoom(Math.max(0.2, Math.min(3, touch.startScale * dist / touch.startDist)), touch.pinchX - rect.left, touch.pinchY - rect.top);
                } else if (touch.dragging && e.touches.length === 1) {
                    panX = touch.startPanX + e.touches[0].clientX - touch.startX;
                    panY = touch.startPanY + e.touches[0].clientY - touch.startY;
                    updateTransform();
                }
            }, { passive: false });

            c.addEventListener('touchend', e => {
                if (e.touches.length === 0) {
                    const now = Date.now();
                    if (now - touch.lastTap < 300) { fitToScreen(); vibrate(10); }
                    touch.lastTap = now;
                    touch.dragging = touch.pinching = false;
                } else if (e.touches.length === 1) {
                    touch.pinching = false;
                    touch.dragging = true;
                    touch.startX = e.touches[0].clientX;
                    touch.startY = e.touches[0].clientY;
                    touch.startPanX = panX;
                    touch.startPanY = panY;
                }
            }, { passive: true });

            let mouseDown = false, msx, msy, mpx, mpy;
            c.addEventListener('mousedown', e => {
                if (e.target === c || e.target.closest('.canvas-wrapper')) {
                    mouseDown = true;
                    msx = e.clientX; msy = e.clientY;
                    mpx = panX; mpy = panY;
                    c.style.cursor = 'grabbing';
                }
            });
            window.addEventListener('mousemove', e => {
                if (mouseDown) {
                    panX = mpx + e.clientX - msx;
                    panY = mpy + e.clientY - msy;
                    updateTransform();
                }
            });
            window.addEventListener('mouseup', () => { mouseDown = false; c.style.cursor = ''; });

            c.addEventListener('wheel', e => {
                e.preventDefault();
                const rect = c.getBoundingClientRect();
                setZoom(Math.max(0.2, Math.min(3, scale * (e.deltaY > 0 ? 0.9 : 1.1))), e.clientX - rect.left, e.clientY - rect.top);
            }, { passive: false });

            c.addEventListener('click', hideCtxMenu);
        }

        // ===== Search =====
        function initSearch() {
            const input = document.getElementById('search-input');
            const results = document.getElementById('search-results');
            let timer;

            input.addEventListener('input', () => {
                clearTimeout(timer);
                timer = setTimeout(() => {
                    const q = input.value.toLowerCase().trim();
                    if (!q) { results.classList.remove('visible'); clearHighlights(); return; }

                    const matches = [];
                    nodeMap.forEach(node => {
                        if (node.label.toLowerCase().includes(q)) matches.push(node);
                    });

                    if (matches.length) {
                        results.innerHTML = `<div class="search-count">${matches.length} result${matches.length > 1 ? 's' : ''}</div>` +
                            matches.slice(0, 10).map(n => `
                                <div class="search-result-item" data-id="${n.id}">
                                    <div class="search-result-label">${esc(n.label)}</div>
                                    <div class="search-result-path">${getPath(n).map(p => p.label).join(' → ')}</div>
                                </div>
                            `).join('');
                        results.classList.add('visible');

                        results.querySelectorAll('.search-result-item').forEach(item => {
                            item.onclick = () => {
                                const node = nodeMap.get(item.dataset.id);
                                if (node) { focusNode(node); results.classList.remove('visible'); input.value = ''; }
                            };
                        });

                        highlightMatches(matches);
                    } else {
                        results.innerHTML = '<div class="search-count">No results</div>';
                        results.classList.add('visible');
                        clearHighlights();
                    }
                }, 150);
            });

            input.addEventListener('keydown', e => {
                if (e.key === 'Escape') { input.value = ''; results.classList.remove('visible'); clearHighlights(); }
            });

            document.addEventListener('keydown', e => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') { e.preventDefault(); input.focus(); input.select(); }
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
                if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault(); redo(); }
            });
        }

        function highlightMatches(nodes) {
            clearHighlights();
            nodes.forEach(n => nodeElements.get(n.id)?.classList.add('highlighted'));
        }

        function clearHighlights() {
            nodeElements.forEach(el => el.classList.remove('highlighted'));
        }

        // ===== Breadcrumb =====
        function updateBreadcrumb() {
            const bc = document.getElementById('breadcrumb');
            if (!selectedNode) { bc.innerHTML = ''; return; }
            const path = getPath(selectedNode);
            bc.innerHTML = path.map((n, i) => `
                <span class="breadcrumb-item" data-id="${n.id}" title="${esc(n.label)}">${esc(n.label)}</span>
                ${i < path.length - 1 ? '<span class="breadcrumb-sep">›</span>' : ''}
            `).join('');
            bc.querySelectorAll('.breadcrumb-item').forEach(item => {
                item.onclick = () => { const n = nodeMap.get(item.dataset.id); if (n) focusNode(n); };
            });
        }

        // ===== Stats =====
        function updateStats() {
            let total = 0, visible = 0, maxD = 0;
            (function count(n, d) {
                total++;
                if (n._visible) visible++;
                maxD = Math.max(maxD, d);
                n.children.forEach(c => count(c, d + 1));
            })(treeData, 0);
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-visible').textContent = visible;
            document.getElementById('stat-depth').textContent = maxD;
        }

        // ===== Tooltip =====
        function showTooltip(el, node) {
            const tt = document.getElementById('tooltip');
            const rect = el.getBoundingClientRect();
            const path = getPath(node).map(n => n.label).join(' → ');
            tt.innerHTML = `<div>${esc(node.label)}</div><div class="tooltip-path">${esc(path)}</div>`;
            tt.style.left = Math.min(rect.right + 10, window.innerWidth - 320) + 'px';
            tt.style.top = rect.top + 'px';
            tt.classList.add('visible');
        }

        function hideTooltip() { document.getElementById('tooltip').classList.remove('visible'); }

        // ===== Context Menu =====
        function showCtxMenu(e, node) {
            contextNode = node;
            const menu = document.getElementById('context-menu');
            menu.style.left = Math.min(e.clientX || e.pageX, window.innerWidth - 200) + 'px';
            menu.style.top = Math.min(e.clientY || e.pageY, window.innerHeight - 280) + 'px';
            menu.classList.add('visible');
        }

        function hideCtxMenu() { document.getElementById('context-menu').classList.remove('visible'); contextNode = null; }

        function ctxExpand() { expand(contextNode); hideCtxMenu(); }
        function ctxCollapse() { collapse(contextNode); hideCtxMenu(); }
        function ctxExpandAll() {
            if (!contextNode) return;
            saveState();
            (function exp(n) { expandedNodes.add(n.id); n.children.forEach(exp); })(contextNode);
            render();
            hideCtxMenu();
            toast('Subtree expanded');
        }
        function ctxCollapseAll() {
            if (!contextNode) return;
            saveState();
            expandedNodes.add(contextNode.id);
            contextNode.children.forEach(function col(n) { expandedNodes.delete(n.id); n.children.forEach(col); });
            render();
            hideCtxMenu();
            toast('Subtree collapsed');
        }
        function ctxFocus() { focusNode(contextNode); hideCtxMenu(); }
        function ctxCopyPath() {
            if (!contextNode) return;
            const path = getPath(contextNode).map(n => n.label).join(' → ');
            navigator.clipboard?.writeText(path);
            hideCtxMenu();
            toast('Path copied!', 'success');
        }

        // ===== Editor =====
        function showEditor() { document.getElementById('editor-modal').classList.add('visible'); }
        function hideEditor() { document.getElementById('editor-modal').classList.remove('visible'); }
        function handleModalClick(e) { if (e.target.classList.contains('modal-overlay')) hideEditor(); }

        function renderMindmap() {
            const input = document.getElementById('mermaid-input').value;
            treeData = parse(input);
            if (!treeData) { toast('Invalid syntax', 'error'); return; }
            localStorage.setItem('mindmap-data', input);
            expandedNodes.clear();
            (function initExp(n) { expandedNodes.add(n.id); n.children.forEach(initExp); })(treeData);
            history.length = 0;
            historyIndex = -1;
            saveState();
            render();
            setTimeout(fitToScreen, 50);
        }

        function renderAndClose() { renderMindmap(); hideEditor(); toast('Rendered!', 'success'); }
        function loadSample() { document.getElementById('mermaid-input').value = SAMPLE; toast('Sample loaded'); }

        // ===== Utils =====
        function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        function vibrate(ms) { navigator.vibrate?.(ms); }
        function toast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast visible' + (type ? ' ' + type : '');
            setTimeout(() => t.classList.remove('visible'), 2000);
        }

        // ===== Init =====
        document.addEventListener('DOMContentLoaded', () => {
            initInput();
            initSearch();

            const saved = localStorage.getItem('mindmap-data');
            document.getElementById('mermaid-input').value = saved || SAMPLE;

            setTimeout(() => { renderMindmap(); fitToScreen(); }, 100);
        });

        // ===== Exports =====
        window.expandAll = expandAll;
        window.collapseAll = collapseAll;
        window.zoomIn = zoomIn;
        window.zoomOut = zoomOut;
        window.fitToScreen = fitToScreen;
        window.undo = undo;
        window.redo = redo;
        window.showEditor = showEditor;
        window.hideEditor = hideEditor;
        window.handleModalClick = handleModalClick;
        window.renderAndClose = renderAndClose;
        window.loadSample = loadSample;
        window.ctxExpand = ctxExpand;
        window.ctxCollapse = ctxCollapse;
        window.ctxExpandAll = ctxExpandAll;
        window.ctxCollapseAll = ctxCollapseAll;
        window.ctxFocus = ctxFocus;
        window.ctxCopyPath = ctxCopyPath;
    })();
    </script>
</body>
</html>

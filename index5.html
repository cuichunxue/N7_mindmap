<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MindFlow Pro — Mermaid Import</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-primary:#020617;
      --accent:#38bdf8;
      --accent-glow:rgba(56,189,248,.3);
      --node-bg:rgba(30,41,59,.72);
      --node-border:rgba(255,255,255,.10);
      --text:#f8fafc;
      --shadow:0 10px 25px -5px rgba(0,0,0,.35);
    }
    html,body{height:100%;}
    body{
      font-family:'Inter',sans-serif;
      background:var(--bg-primary);
      color:var(--text);
      margin:0;
      overflow:hidden;
      -webkit-text-size-adjust:100%;
    }
    .canvas-container{
      position:absolute; inset:0; overflow:hidden;
      background-image:radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0);
      background-size:40px 40px;
      touch-action:none;
      user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
      cursor:grab;
    }
    .canvas-container.dragging{ cursor:grabbing; }
    #canvas-content{
      position:absolute;
      transform-origin:0 0;
      will-change:transform;
      transition:transform .08s ease-out;
    }
    .node{
      position:absolute;
      min-width:120px; max-width:340px;
      padding:12px 18px;
      background:var(--node-bg);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border:1px solid var(--node-border);
      border-radius:16px;
      box-shadow:var(--shadow);
      z-index:10;
      user-select:none; -webkit-user-select:none;
      touch-action:none;
      transform:translate(-50%,-50%);
      transition:box-shadow .2s, border-color .2s, background .2s;
    }
    .node .title{ font-weight:600; line-height:1.25; text-align:center; word-break:break-word; }
    .node .badge{
      font-size:10px; padding:2px 6px; border-radius:999px;
      background:rgba(255,255,255,.10);
      margin-top:6px; display:inline-block;
    }
    .node.active{
      border-color:var(--accent);
      box-shadow:0 0 0 1px rgba(56,189,248,.35), 0 0 28px var(--accent-glow);
      background:rgba(56,189,248,.14);
    }
    .node.root{
      background:linear-gradient(135deg,#0ea5e9 0%, #2563eb 100%);
      border:none;
      padding:16px 28px;
    }
    .node.root .title{ font-weight:800; font-size:1.05rem; }
    .node-input{
      width:100%;
      background:transparent; border:none; outline:none;
      color:white; font:inherit; text-align:center;
    }
    .node[data-color="sky"]{ box-shadow:var(--shadow), 0 0 0 1px rgba(56,189,248,.15) inset; }
    .node[data-color="violet"]{ box-shadow:var(--shadow), 0 0 0 1px rgba(167,139,250,.18) inset; }
    .node[data-color="emerald"]{ box-shadow:var(--shadow), 0 0 0 1px rgba(52,211,153,.18) inset; }
    .node[data-color="amber"]{ box-shadow:var(--shadow), 0 0 0 1px rgba(251,191,36,.18) inset; }
    .node[data-color="rose"]{ box-shadow:var(--shadow), 0 0 0 1px rgba(251,113,133,.18) inset; }

    .node .toggle{
      position:absolute; top:8px; right:8px;
      width:26px; height:26px;
      border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      font-size:12px; color:#e2e8f0;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
    }
    .node .toggle:active{ transform:scale(.96); }
    .node.collapsed .toggle{
      background:rgba(56,189,248,.14);
      border-color:rgba(56,189,248,.22);
    }
    .node .count-badge{
      position:absolute;
      top:8px;
      right:42px;
      min-width:22px;
      height:22px;
      padding:0 6px;
      border-radius:999px;
      font-size:11px;
      font-weight:600;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#e0f2fe;
      background:rgba(56,189,248,.18);
      border:1px solid rgba(56,189,248,.28);
      box-shadow:0 0 12px rgba(56,189,248,.18);
    }

    .connector-path{
      fill:none;
      stroke:rgba(255,255,255,.16);
      stroke-width:2;
      stroke-linecap:round;
    }
    .connector-path.active{
      stroke:var(--accent);
      stroke-width:3;
      filter:drop-shadow(0 0 5px var(--accent));
    }

    .overlay{ position:fixed; z-index:100; pointer-events:none; }
    .overlay > *{ pointer-events:auto; }

    .toolbar{
      bottom:18px; left:50%; transform:translateX(-50%);
      display:flex; gap:10px; padding:8px;
      background:rgba(15,23,42,.85);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,.10);
      border-radius:18px;
    }
    .tool-btn{
      width:46px; height:46px;
      display:flex; align-items:center; justify-content:center;
      border-radius:14px;
      color:#94a3b8;
      transition:.15s;
    }
    .tool-btn:hover{ background:rgba(255,255,255,.10); color:white; }
    .tool-btn:active{ transform:scale(.96); }

    .status-pill{
      display:inline-flex; align-items:center; gap:8px;
      font-size:12px;
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.10);
      padding:6px 10px; border-radius:999px;
      color:#cbd5e1;
      max-width: calc(100vw - 24px);
    }
    .dot{
      width:8px; height:8px; border-radius:50%;
      background:rgba(56,189,248,.9);
      box-shadow:0 0 12px rgba(56,189,248,.45);
      flex: 0 0 auto;
    }

    .minimap{
      right:14px; bottom:90px;
      width:170px; height:110px;
      background:rgba(15,23,42,.55);
      border:1px solid rgba(255,255,255,.10);
      border-radius:12px;
      overflow:hidden;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }
    #minimapCanvas{ width:100%; height:100%; display:block; }

    .ctx{
      position:fixed;
      z-index:1000;
      min-width:220px;
      background:rgba(15,23,42,.92);
      border:1px solid rgba(255,255,255,.12);
      border-radius:14px;
      box-shadow:0 20px 50px rgba(0,0,0,.35);
      padding:8px;
      display:none;
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      pointer-events:auto;
    }
    .ctx .row{ display:flex; gap:8px; padding:6px; border-radius:12px; }
    .ctx .btn{
      flex:1;
      display:flex; align-items:center; justify-content:center;
      height:38px;
      font-size:12px; font-weight:600;
      border-radius:12px;
      color:#e2e8f0;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
    }
    .ctx .btn:active{ transform:scale(.98); }
    .ctx .btn.danger{ color:#fecaca; background:rgba(239,68,68,.12); border-color:rgba(239,68,68,.25); }
    .ctx .btn.primary{ color:#e0f2fe; background:rgba(56,189,248,.12); border-color:rgba(56,189,248,.25); }
    .ctx .label{ font-size:11px; color:#94a3b8; padding:6px 8px 2px; }
    .ctx .colors{ display:flex; gap:8px; padding:6px 8px 8px; }
    .swatch{ width:22px; height:22px; border-radius:999px; border:1px solid rgba(255,255,255,.14); }
    .swatch:active{ transform:scale(.95); }
    .sw-sky{ background:#38bdf8; }
    .sw-violet{ background:#a78bfa; }
    .sw-emerald{ background:#34d399; }
    .sw-amber{ background:#fbbf24; }
    .sw-rose{ background:#fb7185; }

    .toast{
      left:50%; top:18px; transform:translateX(-50%);
      background:rgba(15,23,42,.88);
      border:1px solid rgba(255,255,255,.10);
      padding:10px 12px;
      border-radius:14px;
      color:#e2e8f0;
      font-size:12px;
      display:none;
      gap:8px;
      align-items:center;
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      pointer-events:none;
    }

    /* Mermaid Import Modal */
    #importModal{
      inset:0;
      display:none;
      pointer-events:auto;
      z-index:2000;
    }
    .modal-card{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:min(92vw,720px);
      background:rgba(15,23,42,.95);
      border:1px solid rgba(255,255,255,.12);
      border-radius:16px;
      box-shadow:0 30px 80px rgba(0,0,0,.45);
      padding:14px;
    }
    .modal-textarea{
      margin-top:10px;
      width:100%;
      height:46vh;
      background:rgba(2,6,23,.6);
      color:#e2e8f0;
      border:1px solid rgba(255,255,255,.10);
      border-radius:12px;
      padding:10px;
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
      font-size:12px;
      outline:none;
      resize:none;
    }
    .modal-actions{
      display:flex;
      gap:10px;
      justify-content:flex-end;
      margin-top:10px;
    }
    .modal-btn{
      height:40px;
      padding:0 12px;
      border-radius:12px;
      font-size:12px;
      font-weight:700;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      color:#e2e8f0;
    }
    .modal-btn.primary{
      background:rgba(56,189,248,.12);
      border-color:rgba(56,189,248,.25);
      color:#e0f2fe;
    }
    .modal-btn:active{ transform:scale(.98); }

    /* iOS Safari 安定化：backdrop-filter + transform の不安定を回避 */
    @supports (-webkit-touch-callout: none) {
      .node{
        backdrop-filter:none !important;
        -webkit-backdrop-filter:none !important;
        background:rgba(30,41,59,.88);
      }
    }
  </style>
  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MindFlow Pro">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- /PWA -->
</head>

<body>
  <div class="canvas-container" id="container">
    <div id="canvas-content">
      <svg id="svg-layer" style="position:absolute; top:0; left:0; width:10000px; height:10000px; pointer-events:none;"></svg>
      <div id="nodes-layer"></div>
    </div>
  </div>

  <div class="overlay top-4 left-4 flex flex-col gap-2">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-sky-500 flex items-center justify-center font-black text-sm">M</div>
      <div>
        <div class="text-xl font-black tracking-tight text-white">MindFlow Pro</div>
        <div class="text-[11px] text-slate-400">タップ選択 / ノードはドラッグ移動 / 長押しメニュー / 2本指ピンチ / 折りたたみノードはダブルタップで全展開</div>
      </div>
    </div>
    <div class="status-pill">
      <span class="dot"></span>
      <span id="statusText">Saved</span>
      <span class="text-slate-500">·</span>
      <span class="text-slate-300" id="nodeCount">0 nodes</span>
      <span class="text-slate-500">·</span>
      <span class="text-slate-300" style="white-space:nowrap;">Mermaid mindmap import</span>
    </div>
  </div>

  <div class="overlay minimap">
    <canvas id="minimapCanvas" width="340" height="220"></canvas>
  </div>

  <div class="overlay toast" id="toast"><span class="dot"></span><span id="toastText">Done</span></div>

  <div class="overlay toolbar">
    <button class="tool-btn" onclick="undo()" title="Undo" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14l-4-4 4-4"/><path d="M20 20a8 8 0 0 0-11.3-11.3L5 10"/></svg>
    </button>
    <button class="tool-btn" onclick="redo()" title="Redo" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l4-4-4-4"/><path d="M4 20a8 8 0 0 1 11.3-11.3L19 10"/></svg>
    </button>
    <div class="w-px h-6 bg-slate-700 my-auto mx-1"></div>
    <button class="tool-btn" onclick="zoomIn()" title="Zoom In" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tool-btn" onclick="zoomOut()" title="Zoom Out" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
    </button>
    <button class="tool-btn" onclick="resetView()" title="Reset View" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <div class="w-px h-6 bg-slate-700 my-auto mx-1"></div>
    <button class="tool-btn" onclick="openImport()" title="Mermaid入力" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h6"/>
      </svg>
    </button>
    <button class="tool-btn" onclick="exportData()" title="Export JSON" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
    </button>
    
    <button class="tool-btn" onclick="exportMermaid()" title="Export Mermaid" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4h16v16H4z"/><path d="M7 8h10M7 12h10M7 16h7"/>
      </svg>
    </button>
    <button class="tool-btn" onclick="exportSVG()" title="Export SVG" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4h16v16H4z"/><path d="M8 16l3-8 3 8M7 14h8"/>
      </svg>
    </button>
    <button class="tool-btn" onclick="exportPNG()" title="Export PNG" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 14l2-2 3 3 3-4 2 3"/>
      </svg>
    </button>
<button class="tool-btn" onclick="clearAll()" title="New / Clear" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 16h10l1-16"/></svg>
    </button>
  </div>

  <div class="ctx" id="ctxMenu" role="menu" aria-hidden="true">
    <div class="label" id="ctxLabel">Node</div>

    <div class="row">
      <button class="btn primary" id="ctxAdd">子追加</button>
      <button class="btn" id="ctxEdit">編集</button>
    </div>
    <div class="row">
      <button class="btn" id="ctxToggle">折りたたみ</button>
      <button class="btn" id="ctxCenter">中央へ</button>
    </div>
    <div class="row">
      <button class="btn danger" id="ctxDelete">削除</button>
    </div>

    <div class="label">Color</div>
    <div class="colors">
      <button class="swatch sw-sky" data-c="sky" type="button"></button>
      <button class="swatch sw-violet" data-c="violet" type="button"></button>
      <button class="swatch sw-emerald" data-c="emerald" type="button"></button>
      <button class="swatch sw-amber" data-c="amber" type="button"></button>
      <button class="swatch sw-rose" data-c="rose" type="button"></button>
    </div>
  </div>

  <!-- Mermaid Import Modal -->
  <div class="overlay" id="importModal">
    <div style="position:absolute; inset:0; background:rgba(0,0,0,.55);" onclick="closeImport()"></div>
    <div class="modal-card">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
        <div style="font-weight:800;">Mermaid入力（mindmap / flowchart）</div>
        <button type="button" onclick="closeImport()" class="modal-btn" style="width:44px; padding:0;">✕</button>
      </div>
      <div style="margin-top:10px; font-size:12px; color:#94a3b8;">
        対応：<b>mindmap</b>（インデント） / <b>flowchart TD</b>（矢印） どちらもOK
      </div>
      <textarea id="mermaidInput" class="modal-textarea" placeholder="例（mindmap）:
mindmap
  root((アイデアの種))
    リサーチ
      ユーザー調査
        インタビュー
        ペルソナ
    開発
      API/DB

例（flowchart）:
flowchart TD
  A[Start] --> B{Decision}
  B -->|Yes| C[Do]
  B -->|No| D[Stop]"></textarea>

      
      <div class="modal-actions">
        <button type="button" onclick="loadExampleMermaidMindmap()" class="modal-btn">mindmap例</button>
        <button type="button" onclick="loadExampleMermaidFlowchart()" class="modal-btn">flowchart例</button>
        <button type="button" onclick="generateFromMermaid()" class="modal-btn primary">自動生成</button>
      </div>

    </div>
  </div>

  <script>
    const STORAGE_KEY = "mindflow_pro_index3_mermaid";

    const state = {
      mode: "mindmap", // "mindmap" | "flowchart"
      nodes: [
        { id: "root", text: "アイデアの種", x: 2000, y: 2000, parentId: null, isRoot: true, color: "sky", collapsed: false }
      ],
      edges: [], // flowchart用 {from,to,label?}
      selectedId: "root",
      scale: 1,
      panX: window.innerWidth / 2 - 2000,
      panY: window.innerHeight / 2 - 2000,
      lastMermaid: "" // 最後にインポート/エクスポートしたMermaid
    };

    const config = {
      levelSpacing: 280,
      minScale: 0.1,
      maxScale: 3,
      zoomSpeedWheel: 0.12,
      dragThresholdPx: 6,
      longPressMs: 520,
      doubleTapMs: 320,
      snapToLevels: true,
      avoidOverlap: true,
      overlapIterations: 12,
      overlapPadding: 26
    };

    const container = document.getElementById("container");
    const canvas = document.getElementById("canvas-content");
    const svgLayer = document.getElementById("svg-layer");
    const nodesLayer = document.getElementById("nodes-layer");
    const statusText = document.getElementById("statusText");
    const nodeCount = document.getElementById("nodeCount");
    const minimapCanvas = document.getElementById("minimapCanvas");
    const mm = minimapCanvas.getContext("2d");
    const toast = document.getElementById("toast");
    const toastText = document.getElementById("toastText");

    const ctxMenu = document.getElementById("ctxMenu");
    const ctxLabel = document.getElementById("ctxLabel");
    const ctxAdd = document.getElementById("ctxAdd");
    const ctxEdit = document.getElementById("ctxEdit");
    const ctxDelete = document.getElementById("ctxDelete");
    const ctxCenter = document.getElementById("ctxCenter");
    const ctxToggle = document.getElementById("ctxToggle");

    const history = { past: [], future: [], max: 60 };

    const pointers = new Map();
    let isCanvasPanning = false;
    let lastPanPoint = null;

    let isPinching = false;
    let pinchStartDist = 0;
    let pinchStartScale = 1;
    let pinchAnchorScreen = { x: 0, y: 0 };
    let pinchAnchorWorld = { x: 0, y: 0 };

    let nodeDrag = {
      active:false, pointerId:null, nodeId:null,
      startScreen:{x:0,y:0},
      startNode:{x:0,y:0},
      moved:false
    };

    let lastTap = { time: 0, nodeId: null };
    let longPressTimer = null;

    let saveTimer = null;

    function snapshot() {
      return {
        mode: state.mode,
        nodes: state.nodes.map(n => ({...n})),
        edges: (state.edges || []).map(e => ({...e})),
        selectedId: state.selectedId,
        scale: state.scale,
        panX: state.panX,
        panY: state.panY,
        lastMermaid: state.lastMermaid || ""
      };
    }

    function restore(snap) {
      state.mode = snap.mode || "mindmap";
      state.nodes = (snap.nodes || []).map(n => ({...n}));
      state.edges = (snap.edges || []).map(e => ({...e}));
      state.selectedId = snap.selectedId || (state.nodes.some(n=>n.id==="root") ? "root" : (state.nodes[0]?.id || "root"));
      state.scale = (snap.scale ?? 1);
      state.panX = (snap.panX ?? (window.innerWidth/2 - 2000));
      state.panY = (snap.panY ?? (window.innerHeight/2 - 2000));
      state.lastMermaid = snap.lastMermaid || "";

      // 互換：collapsed/colorが無い古いデータ
      for (const n of state.nodes) {
        if (typeof n.collapsed !== "boolean") n.collapsed = false;
        if (!n.color) n.color = "sky";
        if (state.mode === "flowchart") n.parentId = null;
      }

      update(true);
      markSaved();
    }

    function pushHistory() {
      history.past.push(snapshot());
      if (history.past.length > history.max) history.past.shift();
      history.future.length = 0;
      markDirty();
    }

    function undo() {
      if (!history.past.length) { ping("No undo"); return; }
      history.future.push(snapshot());
      restore(history.past.pop());
      ping("Undo");
    }

    function redo() {
      if (!history.future.length) { ping("No redo"); return; }
      history.past.push(snapshot());
      restore(history.future.pop());
      ping("Redo");
    }

    function addNode(parentId, text="新しいノード", push=true, edgeLabel="") {
      const parent = state.nodes.find(n => n.id === parentId) || state.nodes.find(n=>n.id==="root") || state.nodes[0];
      if (!parent) return null;
      if (push) pushHistory();

      // mindmapでは親が折りたたみなら展開
      if (state.mode === "mindmap" && parent.collapsed) parent.collapsed = false;

      const id = "n-" + Math.random().toString(36).slice(2, 11);
      const node = {
        id,
        text,
        parentId: (state.mode === "mindmap") ? parentId : null,
        x: parent.x + config.levelSpacing,
        y: parent.y + (Math.random() - 0.5) * 240,
        color: parent.color || "sky",
        collapsed: false,
        mid: (state.mode === "flowchart") ? makeMermaidId(text, id) : undefined
      };

      state.nodes.push(node);

      if (state.mode === "flowchart") {
        state.edges = state.edges || [];
        state.edges.push({ from: parentId, to: id, label: edgeLabel || "" });
        // DAG再レイアウト
        layoutDAG(state.nodes, state.edges);
      } else {
        if (config.snapToLevels) snapNodeToLevel(node);
        if (config.avoidOverlap) relaxOverlaps();
      }

      state.selectedId = id;
      update(true);
      scheduleSave();
      return id;
    }

    function deleteNode(nodeId, push=true) {
      const node = state.nodes.find(n => n.id === nodeId);
      if (!node) return;
      if (node.isRoot) return;

      if (push) pushHistory();

      if (state.mode === "flowchart") {
        state.nodes = state.nodes.filter(n => n.id !== nodeId);
        state.edges = (state.edges || []).filter(e => e.from !== nodeId && e.to !== nodeId);
        state.selectedId = state.nodes[0]?.id || "root";
        layoutDAG(state.nodes, state.edges);
        update(true);
        scheduleSave();
        ping("Deleted");
        return;
      }

      // mindmap：サブツリー削除
      const toDelete = new Set([nodeId]);
      let changed = true;
      while (changed) {
        changed = false;
        for (const n of state.nodes) {
          if (n.parentId && toDelete.has(n.parentId) && !toDelete.has(n.id)) {
            toDelete.add(n.id);
            changed = true;
          }
        }
      }
      state.nodes = state.nodes.filter(n => !toDelete.has(n.id));
      state.selectedId = "root";

      update(true);
      scheduleSave();
      ping("Deleted");
    }

    function editNode(node, el, push=true) {
      if (push) pushHistory();
      closeCtx();

      const title = el.querySelector(".title");
      const originalText = node.text;

      title.innerHTML = `<input class="node-input" type="text" value="${escapeAttr(originalText)}" />`;
      const input = title.querySelector("input");
      input.focus(); input.select();

      const save = () => {
        node.text = input.value || originalText;
        update(true);
        scheduleSave();
        markDirty();
      };

      input.addEventListener("blur", save, { once:false });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") save();
        if (e.key === "Escape") { input.value = originalText; save(); }
      });
    }

    function setNodeColor(nodeId, color, push=true) {
      const node = state.nodes.find(n => n.id === nodeId);
      if (!node) return;
      if (push) pushHistory();
      node.color = color;
      update(true);
      scheduleSave();
    }

    function toggleCollapse(nodeId, push=true) {
      if (state.mode === "flowchart") return;
      const node = state.nodes.find(n => n.id === nodeId);
      if (!node || node.isRoot) return;
      if (push) pushHistory();
      node.collapsed = !node.collapsed;
      update(true);
      scheduleSave();
      ping(node.collapsed ? "Collapsed" : "Expanded");
    }

    function expandAllFrom(nodeId, push=true){
      const byId = new Map(state.nodes.map(n => [n.id, n]));
      if (!byId.has(nodeId)) return;
      if (push) pushHistory();

      const stack = [nodeId];
      while (stack.length){
        const id = stack.pop();
        const n = byId.get(id);
        if (!n) continue;
        n.collapsed = false;
        for (const c of state.nodes){
          if (c.parentId === id) stack.push(c.id);
        }
      }
      update(true);
      scheduleSave();
      ping("Expanded all");
    }

    function countDescendants(nodeId){
      const toVisit = [nodeId];
      const seen = new Set([nodeId]);
      let count = 0;
      while (toVisit.length){
        const id = toVisit.pop();
        for (const n of state.nodes){
          if (n.parentId === id && !seen.has(n.id)){
            seen.add(n.id);
            toVisit.push(n.id);
            count++;
          }
        }
      }
      return count;
    }

    function getVisibleNodeIds() {
      // flowchartは折りたたみ概念が無いので全表示
      if (state.mode === "flowchart") {
        return new Set(state.nodes.map(n => n.id));
      }

      const byId = new Map(state.nodes.map(n => [n.id, n]));
      const visible = new Set();

      function dfs(id) {
        const node = byId.get(id);
        if (!node) return;
        visible.add(id);
        if (node.collapsed) return;
        for (const child of state.nodes) {
          if (child.parentId === id) dfs(child.id);
        }
      }

      dfs("root");
      return visible;
    }

    function update(full=false) {
      if (full) renderNodes();
      renderLines();
      applyTransform();
      updateStatus();
      renderMinimap();
    }

    function renderNodes() {
      nodesLayer.innerHTML = "";
      const visible = getVisibleNodeIds();

      state.nodes.forEach(node => {
        if (!visible.has(node.id)) return;

        const el = document.createElement("div");
        el.className = `node ${node.isRoot ? "root" : ""} ${state.selectedId === node.id ? "active" : ""} ${node.collapsed ? "collapsed" : ""}`;
        el.dataset.id = node.id;
        el.dataset.color = node.color || "sky";
        el.style.left = node.x + "px";
        el.style.top  = node.y + "px";

        const hasChild = state.nodes.some(n => n.parentId === node.id);
        const descendantCount = node.collapsed ? countDescendants(node.id) : 0;

        el.innerHTML = `
          <div class="title">${escapeHtml(node.text)}</div>
          ${node.isRoot ? "" : `<div class="badge">Topic</div>`}
          ${node.collapsed && descendantCount > 0 ? `<div class="count-badge">+${descendantCount}</div>` : ""}
          ${hasChild ? `<button class="toggle" type="button" aria-label="toggle">${node.collapsed ? "▸" : "▾"}</button>` : ""}
        `;

        const toggleBtn = el.querySelector(".toggle");
        if (toggleBtn) {
          toggleBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
          toggleBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleCollapse(node.id, true);
          });
        }

        el.addEventListener("pointerdown", (e) => {
          e.stopPropagation();
          if (document.activeElement && document.activeElement.tagName === "INPUT") return;

          pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
          el.setPointerCapture(e.pointerId);

          state.selectedId = node.id;
          update(true);

          clearTimeout(longPressTimer);
          longPressTimer = setTimeout(() => {
            if (nodeDrag.active && nodeDrag.moved) return;
            openCtx(node.id, e.clientX, e.clientY);
          }, config.longPressMs);

          nodeDrag.active = true;
          nodeDrag.pointerId = e.pointerId;
          nodeDrag.nodeId = node.id;
          nodeDrag.startScreen = { x: e.clientX, y: e.clientY };
          nodeDrag.startNode = { x: node.x, y: node.y };
          nodeDrag.moved = false;

          closeCtx();
        });

        el.addEventListener("pointermove", (e) => {
          if (!nodeDrag.active || nodeDrag.pointerId !== e.pointerId) return;
          if (isPinching) return;

          const node = state.nodes.find(n => n.id === nodeDrag.nodeId);
          if (!node) return;

          const dxS = e.clientX - nodeDrag.startScreen.x;
          const dyS = e.clientY - nodeDrag.startScreen.y;

          if (!nodeDrag.moved && Math.hypot(dxS, dyS) >= config.dragThresholdPx) {
            nodeDrag.moved = true;
            clearTimeout(longPressTimer);
            pushHistory();
          }
          if (!nodeDrag.moved) return;

          const dxW = dxS / state.scale;
          const dyW = dyS / state.scale;

          node.x = nodeDrag.startNode.x + dxW;
          node.y = nodeDrag.startNode.y + dyW;

          renderNodes();
          renderLines();
          renderMinimap();
          markDirty();
        });

        el.addEventListener("pointerup", (e) => {
          pointers.delete(e.pointerId);
          clearTimeout(longPressTimer);

          if (nodeDrag.active && nodeDrag.pointerId === e.pointerId) {
            const moved = nodeDrag.moved;
            const nodeId = nodeDrag.nodeId;
            nodeDrag.active = false;

            if (!moved) {
              const now = Date.now();
              const isDoubleTap = (lastTap.nodeId === nodeId) && (now - lastTap.time < config.doubleTapMs);
              lastTap = { time: now, nodeId };

              if (isDoubleTap) {
                const node = state.nodes.find(n => n.id === nodeId);
                if (node && node.collapsed) {
                  expandAllFrom(nodeId, true);
                } else {
                  const latest = document.querySelector(`.node[data-id="${nodeId}"]`);
                  if (node && latest) editNode(node, latest, true);
                }
              }
            } else {
              const node = state.nodes.find(n => n.id === nodeId);
              if (node && config.snapToLevels) snapNodeToLevel(node);
              if (config.avoidOverlap) relaxOverlaps();
              update(true);
              scheduleSave();
              markDirty();
            }
          }
        });

        el.addEventListener("pointercancel", (e) => {
          pointers.delete(e.pointerId);
          clearTimeout(longPressTimer);
          if (nodeDrag.pointerId === e.pointerId) nodeDrag.active = false;
        });

        nodesLayer.appendChild(el);
      });
    }

    function renderLines() {
      svgLayer.innerHTML = "";
      const visible = getVisibleNodeIds();
      const paths = [];

      if (state.mode === "flowchart" && (state.edges || []).length) {
        for (const e of state.edges) {
          const a = state.nodes.find(n=>n.id===e.from);
          const b = state.nodes.find(n=>n.id===e.to);
          if (!a || !b) continue;
          if (!visible.has(a.id) || !visible.has(b.id)) continue;
          paths.push({ from:a, to:b, label: e.label || "" });
        }
      } else {
        for (const node of state.nodes) {
          if (!node.parentId) continue;
          if (!visible.has(node.id)) continue;
          const parent = state.nodes.find(n => n.id === node.parentId);
          if (!parent || !visible.has(parent.id)) continue;
          paths.push({ from: parent, to: node, label: "" });
        }
      }

      for (const p of paths) {
        const x1 = p.from.x, y1 = p.from.y;
        const x2 = p.to.x, y2 = p.to.y;
        const dx = Math.max(80, Math.abs(x2 - x1) * 0.5);
        const d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        const active = (state.selectedId === p.to.id) || (state.mode==="flowchart" && state.selectedId === p.from.id);
        path.setAttribute("d", d);
        path.setAttribute("class", "connector-path" + (active ? " active" : ""));
        svgLayer.appendChild(path);

        // ラベル（flowchartのみ / labelがあるとき）
        if (state.mode === "flowchart" && p.label) {
          const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
          t.setAttribute("x", (x1+x2)/2);
          t.setAttribute("y", (y1+y2)/2 - 10);
          t.setAttribute("text-anchor", "middle");
          t.setAttribute("font-size", "12");
          t.setAttribute("fill", "rgba(226,232,240,.85)");
          t.textContent = p.label;
          svgLayer.appendChild(t);
        }
      }
    }

    function applyTransform() {
      canvas.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.scale}) translateZ(0)`;
    }

    function updateStatus() { nodeCount.textContent = `${state.nodes.length} nodes`; }

    function renderMinimap() {
      const nodes = state.nodes;
      if (!nodes.length) return;

      let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
      for (const n of nodes) {
        minX = Math.min(minX, n.x);
        minY = Math.min(minY, n.y);
        maxX = Math.max(maxX, n.x);
        maxY = Math.max(maxY, n.y);
      }
      const pad = 220;
      minX -= pad; minY -= pad; maxX += pad; maxY += pad;

      const w = minimapCanvas.width, h = minimapCanvas.height;
      mm.clearRect(0,0,w,h);

      const bw = maxX - minX;
      const bh = maxY - minY;
      const s = Math.min(w / bw, h / bh);

      const tx = (x)=> (x - minX) * s;
      const ty = (y)=> (y - minY) * s;

      mm.lineWidth = 2;
      mm.strokeStyle = "rgba(255,255,255,0.12)";
      for (const n of nodes) {
        if (!n.parentId) continue;
        const p = nodes.find(x => x.id === n.parentId);
        if (!p) continue;
        mm.beginPath();
        mm.moveTo(tx(p.x), ty(p.y));
        mm.lineTo(tx(n.x), ty(n.y));
        mm.stroke();
      }

      for (const n of nodes) {
        const r = n.id === "root" ? 6 : 4;
        mm.beginPath();
        mm.fillStyle = (n.id === state.selectedId) ? "rgba(56,189,248,0.95)" : "rgba(203,213,225,0.75)";
        mm.arc(tx(n.x), ty(n.y), r, 0, Math.PI*2);
        mm.fill();
      }

      const sx0 = 0, sy0 = 0, sx1 = window.innerWidth, sy1 = window.innerHeight;
      const wx0 = (sx0 - state.panX) / state.scale;
      const wy0 = (sy0 - state.panY) / state.scale;
      const wx1 = (sx1 - state.panX) / state.scale;
      const wy1 = (sy1 - state.panY) / state.scale;

      mm.strokeStyle = "rgba(56,189,248,0.55)";
      mm.lineWidth = 2;
      mm.strokeRect(tx(wx0), ty(wy0), (wx1-wx0)*s, (wy1-wy0)*s);
    }

    function setupEventListeners() {
      document.addEventListener("pointerdown", (e) => {
        if (!e.target.closest("#ctxMenu") && !e.target.closest("#importModal")) closeCtx();
      });

      container.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".node")) return;
        closeCtx();
        clearTimeout(longPressTimer);

        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        container.setPointerCapture(e.pointerId);

        if (pointers.size === 1) {
          isCanvasPanning = true;
          container.classList.add("dragging");
          lastPanPoint = { x: e.clientX, y: e.clientY };
        }

        if (pointers.size === 2) {
          isPinching = true;
          isCanvasPanning = false;
          container.classList.add("dragging");

          const pts = Array.from(pointers.values());
          pinchStartDist = dist(pts[0], pts[1]);
          pinchStartScale = state.scale;

          pinchAnchorScreen = { x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2 };
          pinchAnchorWorld  = screenToWorld(pinchAnchorScreen.x, pinchAnchorScreen.y);

          nodeDrag.active = false;
          clearTimeout(longPressTimer);
        }
      });

      container.addEventListener("pointermove", (e) => {
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (isPinching && pointers.size >= 2) {
          const pts = Array.from(pointers.values()).slice(0,2);
          const d = dist(pts[0], pts[1]);
          const ratio = d / (pinchStartDist || d);
          state.scale = clamp(pinchStartScale * ratio, config.minScale, config.maxScale);
          state.panX = pinchAnchorScreen.x - pinchAnchorWorld.x * state.scale;
          state.panY = pinchAnchorScreen.y - pinchAnchorWorld.y * state.scale;
          applyTransform();
          renderMinimap();
          return;
        }

        if (isCanvasPanning && pointers.size === 1 && lastPanPoint) {
          const dx = e.clientX - lastPanPoint.x;
          const dy = e.clientY - lastPanPoint.y;
          state.panX += dx;
          state.panY += dy;
          lastPanPoint = { x: e.clientX, y: e.clientY };
          applyTransform();
          renderMinimap();
        }
      });

      container.addEventListener("pointerup", (e) => {
        pointers.delete(e.pointerId);
        if (pointers.size === 0) {
          isCanvasPanning = false;
          isPinching = false;
          lastPanPoint = null;
          container.classList.remove("dragging");
        } else if (pointers.size === 1) {
          isPinching = false;
          isCanvasPanning = true;
          const only = Array.from(pointers.values())[0];
          lastPanPoint = { x: only.x, y: only.y };
        }
      });

      container.addEventListener("pointercancel", () => {
        pointers.clear();
        isCanvasPanning = false;
        isPinching = false;
        lastPanPoint = null;
        container.classList.remove("dragging");
      });

      container.addEventListener("wheel", (e) => {
        e.preventDefault();
        const rect = container.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        const beforeX = (mx - state.panX) / state.scale;
        const beforeY = (my - state.panY) / state.scale;

        const zoom = e.deltaY > 0 ? (1 - config.zoomSpeedWheel) : (1 + config.zoomSpeedWheel);
        state.scale = clamp(state.scale * zoom, config.minScale, config.maxScale);

        state.panX = mx - beforeX * state.scale;
        state.panY = my - beforeY * state.scale;

        applyTransform();
        renderMinimap();
      }, { passive:false });

      ctxAdd.addEventListener("click", () => {
        const id = ctxMenu.dataset.nodeId;
        addNode(id, "新しいノード");
        closeCtx();
      });

      ctxEdit.addEventListener("click", () => {
        const id = ctxMenu.dataset.nodeId;
        const node = state.nodes.find(n => n.id === id);
        const el = document.querySelector(`.node[data-id="${id}"]`);
        if (node && el) editNode(node, el);
      });

      ctxToggle.addEventListener("click", () => {
        const id = ctxMenu.dataset.nodeId;
        toggleCollapse(id, true);
        closeCtx();
      });

      ctxDelete.addEventListener("click", () => {
        const id = ctxMenu.dataset.nodeId;
        deleteNode(id);
        closeCtx();
      });

      ctxCenter.addEventListener("click", () => {
        const id = ctxMenu.dataset.nodeId;
        centerOnNode(id);
        closeCtx();
      });

      ctxMenu.querySelectorAll(".swatch").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = ctxMenu.dataset.nodeId;
          setNodeColor(id, btn.dataset.c);
        });
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeCtx();
          closeImport();
        }
        // shortcuts (desktop)
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !e.shiftKey){ e.preventDefault(); undo(); }
        if (((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && e.shiftKey) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y")){ e.preventDefault(); redo(); }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "m"){ e.preventDefault(); openImport(); }
      });

      window.addEventListener("resize", () => {
        closeCtx();
        renderMinimap();
      });
    }

    function openCtx(nodeId, x, y) {
      const node = state.nodes.find(n => n.id === nodeId);
      if (!node) return;

      ctxMenu.dataset.nodeId = nodeId;
      ctxLabel.textContent = node.isRoot ? "Root" : "Node";
      ctxDelete.style.display = node.isRoot ? "none" : "flex";
      ctxToggle.textContent = node.collapsed ? "展開" : "折りたたみ";
      ctxToggle.style.display = (state.mode === "mindmap" && !node.isRoot) ? "flex" : "none";

      const margin = 10;
      ctxMenu.style.display = "block";
      const rect = ctxMenu.getBoundingClientRect();
      const vw = window.innerWidth, vh = window.innerHeight;

      let left = x;
      let top  = y;

      if (left + rect.width + margin > vw) left = vw - rect.width - margin;
      if (top  + rect.height + margin > vh) top  = vh - rect.height - margin;
      if (left < margin) left = margin;
      if (top  < margin) top  = margin;

      ctxMenu.style.left = left + "px";
      ctxMenu.style.top  = top  + "px";
      ctxMenu.setAttribute("aria-hidden","false");
    }

    function closeCtx() {
      ctxMenu.style.display = "none";
      ctxMenu.setAttribute("aria-hidden","true");
    }

    function clamp(n,a,b){ return Math.min(Math.max(a,n),b); }
    function zoomIn(){ state.scale = clamp(state.scale*1.2, config.minScale, config.maxScale); applyTransform(); renderMinimap(); }
    function zoomOut(){ state.scale = clamp(state.scale/1.2, config.minScale, config.maxScale); applyTransform(); renderMinimap(); }
    function resetView(){
      state.scale = 1;
      state.panX = window.innerWidth / 2 - 2000;
      state.panY = window.innerHeight / 2 - 2000;
      applyTransform(); renderMinimap();
    }

    function centerOnNode(nodeId){
      const node = state.nodes.find(n => n.id === nodeId);
      if (!node) return;
      pushHistory();
      state.panX = window.innerWidth/2  - node.x * state.scale;
      state.panY = window.innerHeight/2 - node.y * state.scale;
      applyTransform(); renderMinimap();
      scheduleSave();
      ping("Centered");
    }

    function screenToWorld(sx, sy){ return { x:(sx - state.panX)/state.scale, y:(sy - state.panY)/state.scale }; }

    function snapNodeToLevel(node){
      if (!node.parentId) return;
      const parent = state.nodes.find(n => n.id === node.parentId);
      if (!parent) return;
      const targetX = parent.x + config.levelSpacing;
      node.x = lerp(node.x, targetX, 0.55);
    }

    function relaxOverlaps(){
      const padding = config.overlapPadding;
      for (let iter=0; iter<config.overlapIterations; iter++){
        let moved = false;
        for (let i=0; i<state.nodes.length; i++){
          for (let j=i+1; j<state.nodes.length; j++){
            const a = state.nodes[i], b = state.nodes[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const d  = Math.hypot(dx,dy) || 0.0001;
            const ra = (a.isRoot ? 120 : 95);
            const rb = (b.isRoot ? 120 : 95);
            const minD = ra + rb + padding;
            if (d < minD){
              const push = (minD - d) * 0.5;
              const ux = dx / d, uy = dy / d;
              const wa = a.isRoot ? 0.15 : 1.0;
              a.x -= ux * push * wa; a.y -= uy * push * wa;
              b.x += ux * push * 1.0; b.y += uy * push * 1.0;
              moved = true;
            }
          }
        }
        if (!moved) break;
      }
      const root = state.nodes.find(n => n.id === "root");
      if (root) root.y = 2000;
    }

    function lerp(a,b,t){ return a + (b-a)*t; }

    function exportData(){
      const data = snapshot();
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
      const a = document.createElement("a");
      a.href = dataStr;
      a.download = "mindmap_export.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      ping("Exported");
    }

    function exportMermaid(){
      const text = buildMermaidFromState();
      if (!text) { ping("No data"); return; }
      state.lastMermaid = text;
      downloadText(text, "mindflow_export.mmd", "text/plain");
      // クリップボード（可能なら）
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(()=>ping("Mermaid copied")).catch(()=>ping("Mermaid exported"));
      } else {
        ping("Mermaid exported");
      }
    }

    function buildMermaidFromState(){
      if (state.mode === "flowchart") {
        // ノードIDを確定
        const idMap = new Map();
        const used = new Set();
        for (const n of state.nodes){
          let mid = n.mid || makeMermaidId(n.text, n.id);
          while (used.has(mid)) mid = mid + "_" + Math.random().toString(36).slice(2,4);
          used.add(mid);
          idMap.set(n.id, mid);
        }
        const nodeDecl = (nid)=>{
          const n = state.nodes.find(x=>x.id===nid);
          const mid = idMap.get(nid);
          const txt = (n?.text ?? mid).toString().replace(/\]/g,"\\]").replace(/\n/g," ");
          return `${mid}[${txt}]`;
        };

        let out = "flowchart TD\n";
        for (const e of (state.edges||[])){
          if (!idMap.has(e.from) || !idMap.has(e.to)) continue;
          const l = (e.label||"").trim();
          if (l) out += `  ${nodeDecl(e.from)} -->|${l}| ${nodeDecl(e.to)}\n`;
          else out += `  ${nodeDecl(e.from)} --> ${nodeDecl(e.to)}\n`;
        }
        // エッジが無い場合もノードだけ出す
        if (!(state.edges||[]).length){
          for (const n of state.nodes){
            const mid = idMap.get(n.id);
            const txt = (n.text||mid).toString().replace(/\]/g,"\\]").replace(/\n/g," ");
            out += `  ${mid}[${txt}]\n`;
          }
        }
        return out.trimEnd();
      }

      // mindmap
      const byParent = new Map();
      for (const n of state.nodes){
        const pid = n.parentId || "";
        if (!byParent.has(pid)) byParent.set(pid, []);
        byParent.get(pid).push(n);
      }
      for (const arr of byParent.values()){
        arr.sort((a,b)=> (a.text||"").localeCompare((b.text||""), "ja"));
      }

      const root = state.nodes.find(n=>n.id==="root");
      const rootText = (root?.text || "root").toString().replace(/\n/g," ");
      let out = "mindmap\n";
      out += `  root((${rootText}))\n`;

      function walk(pid, depth){
        const kids = byParent.get(pid) || [];
        for (const k of kids){
          if (k.id === "root") continue;
          const indent = "  ".repeat(depth);
          const t = (k.text||"").toString().replace(/\n/g," ");
          out += `${indent}${t}\n`;
          walk(k.id, depth+1);
        }
      }
      walk("root", 2);
      return out.trimEnd();
    }

    function exportPNG(){
      const svg = buildExportSVG();
      if (!svg) { ping("PNG failed"); return; }

      const svgBlob = new Blob([svg], {type:"image/svg+xml;charset=utf-8"});
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = () => {
        const rect = container.getBoundingClientRect();
        const dpr = Math.max(2, window.devicePixelRatio || 1);
        const w = Math.floor(rect.width * dpr);
        const h = Math.floor(rect.height * dpr);

        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.clearRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);

        c.toBlob((blob)=>{
          if (blob) downloadBlob(blob, "mindflow_export.png");
          URL.revokeObjectURL(url);
          ping("PNG exported");
        }, "image/png");
      };
      img.onerror = () => { URL.revokeObjectURL(url); ping("PNG error"); };
      img.src = url;
    }

    function buildExportSVG(){
      // 現在の画面（viewport）をそのまま書き出す
      const rect = container.getBoundingClientRect();
      const w0 = screenToWorld(0,0);
      const w1 = screenToWorld(rect.width, rect.height);
      const margin = 80;

      const minX = Math.min(w0.x, w1.x) - margin;
      const minY = Math.min(w0.y, w1.y) - margin;
      const maxX = Math.max(w0.x, w1.x) + margin;
      const maxY = Math.max(w0.y, w1.y) + margin;

      const vbW = (maxX - minX);
      const vbH = (maxY - minY);

      const visible = getVisibleNodeIds();
      const nodes = state.nodes.filter(n=>visible.has(n.id));

      const colorFill = (c)=>{
        switch(c){
          case "violet": return "rgba(124,58,237,.20)";
          case "emerald": return "rgba(16,185,129,.18)";
          case "amber": return "rgba(245,158,11,.18)";
          case "rose": return "rgba(244,63,94,.18)";
          default: return "rgba(56,189,248,.18)";
        }
      };
      const colorStroke = (c)=>{
        switch(c){
          case "violet": return "rgba(196,181,253,.65)";
          case "emerald": return "rgba(110,231,183,.65)";
          case "amber": return "rgba(253,230,138,.65)";
          case "rose": return "rgba(253,164,175,.65)";
          default: return "rgba(125,211,252,.65)";
        }
      };

      const escapeXml = (s)=> (s||"").toString()
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;").replace(/'/g,"&apos;");

      // edges
      const edgeList = [];
      if (state.mode === "flowchart" && (state.edges||[]).length) {
        for (const e of state.edges){
          const a = state.nodes.find(n=>n.id===e.from);
          const b = state.nodes.find(n=>n.id===e.to);
          if (!a || !b) continue;
          if (!visible.has(a.id) || !visible.has(b.id)) continue;
          edgeList.push({a,b,label:e.label||""});
        }
      } else {
        for (const n of nodes){
          if (!n.parentId) continue;
          const p = state.nodes.find(x=>x.id===n.parentId);
          if (!p || !visible.has(p.id)) continue;
          edgeList.push({a:p,b:n,label:""});
        }
      }

      // ノードサイズ：文字数から近似
      const nodeBox = (t, isRoot)=>{
        const len = (t||"").toString().length;
        const w = Math.max(140, Math.min(360, 70 + len*14));
        const h = isRoot ? 68 : 60;
        return { w, h };
      };

      let svg = '';
      svg += `<svg xmlns="http://www.w3.org/2000/svg" width="${rect.width}" height="${rect.height}" viewBox="${minX} ${minY} ${vbW} ${vbH}">`;
      svg += `<rect x="${minX}" y="${minY}" width="${vbW}" height="${vbH}" fill="#020617"/>`;

      // connectors
      for (const e of edgeList){
        const x1=e.a.x, y1=e.a.y, x2=e.b.x, y2=e.b.y;
        const dx = Math.max(80, Math.abs(x2-x1)*0.5);
        const d = `M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`;
        svg += `<path d="${d}" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-linecap="round"/>`;
        if (state.mode==="flowchart" && e.label){
          svg += `<text x="${(x1+x2)/2}" y="${(y1+y2)/2 - 10}" text-anchor="middle" font-size="12" fill="rgba(226,232,240,.85)">${escapeXml(e.label)}</text>`;
        }
      }

      // nodes
      for (const n of nodes){
        const {w,h} = nodeBox(n.text, n.isRoot);
        const x = n.x - w/2;
        const y = n.y - h/2;
        if (n.isRoot){
          svg += `<defs><linearGradient id="gRoot" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs>`;
          svg += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="16" fill="url(#gRoot)" stroke="rgba(255,255,255,0.10)" stroke-width="1.2"/>`;
          svg += `<text x="${n.x}" y="${n.y+6}" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">${escapeXml(n.text)}</text>`;
        } else {
          const fill = colorFill(n.color||"sky");
          const stroke = colorStroke(n.color||"sky");
          svg += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="16" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/>`;
          svg += `<text x="${n.x}" y="${n.y+5}" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">${escapeXml(n.text)}</text>`;
        }
      }

      svg += `</svg>`;
      return svg;
    }

function parseMermaidAny(src){
      if (!src) return null;
      const first = src.trim().split("\n")[0].trim().toLowerCase();
      if (first.startsWith("mindmap")) return parseMermaidMindmap(src);
      if (first.startsWith("flowchart") || first.startsWith("graph")) return parseMermaidFlowchart(src);
      // ざっくり判定
      if (src.includes("mindmap")) return parseMermaidMindmap(src);
      if (src.includes("-->") || src.includes("graph") || src.includes("flowchart")) return parseMermaidFlowchart(src);
      return null;
    }

    function stripShapeText(s){
      if (!s) return "";
      // [text]  (text)  ((text))  {text}
      const t = s.trim();
      if ((t.startsWith("[") && t.endsWith("]")) || (t.startsWith("(") && t.endsWith(")")) || (t.startsWith("{") && t.endsWith("}"))) {
        // ((...))もここでOK
        return t.replace(/^\(+/,"").replace(/^\[/,"").replace(/^\{/,"").replace(/\)+$/,"").replace(/\]$/,"").replace(/\}$/,"");
      }
      return t;
    }

    function makeMermaidId(text, fallbackId){
      // Mermaid IDは英字で始めるのが安全
      const base = (text || "").toLowerCase()
        .replace(/[\s]+/g, "_")
        .replace(/[^a-z0-9_]/g, "")
        .slice(0, 14);
      const suf = (fallbackId || Math.random().toString(36).slice(2,6)).replace(/[^a-z0-9]/gi,"").slice(-4);
      const id = ("n_" + (base || "node") + "_" + suf);
      return id.replace(/^([^a-zA-Z])/, "n$1");
    }

    function parseFlowNodeToken(token){
      // token: A[Text] / A((Text)) / A{Text} / A(Text) / A
      const t = (token || "").trim();
      const m = t.match(/^([A-Za-z0-9_]+)\s*(\(\([^\)]*\)\)|\([^\)]*\)|\[[^\]]*\]|\{[^\}]*\})?\s*$/);
      if (!m) return { id: t, text: t };
      const id = m[1];
      const shape = m[2] || "";
      const text = shape ? stripShapeText(shape) : id;
      return { id, text };
    }

    function parseMermaidFlowchart(src){
      const lines = src.replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(l=>l.length && !l.startsWith("%%"));
      if (!lines.length) return null;
      const head = lines[0].toLowerCase();
      if (!(head.startsWith("flowchart") || head.startsWith("graph"))) return null;

      const nodesByMid = new Map();
      const nodes = [];
      const edges = [];

      function ensureNode(mid, text){
        if (!mid) return null;
        if (!nodesByMid.has(mid)){
          const id = "n-" + Math.random().toString(36).slice(2, 11);
          const node = { id, text: text || mid, x:2000, y:2000, parentId:null, isRoot:false, color:"sky", collapsed:false, mid };
          nodesByMid.set(mid, node);
          nodes.push(node);
        } else if (text && nodesByMid.get(mid).text === mid){
          nodesByMid.get(mid).text = text;
        }
        return nodesByMid.get(mid);
      }

      // 2行目以降を解析
      for (let i=1;i<lines.length;i++){
        let line = lines[i];
        if (!line) continue;

        // サブグラフやスタイルなどはスキップ（最低限）
        if (line.startsWith("subgraph") || line.startsWith("end") || line.startsWith("classDef") || line.startsWith("class ")) continue;

        // ラベル付き: A -->|Yes| B
        let label = "";
        const labelMatch = line.match(/\-\-\>\s*\|([^|]+)\|\s*/);
        if (labelMatch) label = labelMatch[1].trim();

        // 矢印を検出（--> / --- / -.-> など）
        const arrowRe = /(-+\.?-+>)/;
        const parts = line.split(arrowRe);
        if (parts.length < 3) continue;

        const leftToken = parts[0].trim();
        const rightToken = parts.slice(2).join("").trim(); // 後半まとめる

        // 右側に余計な記号が付くケースを軽く除去
        const rightClean = rightToken.replace(/^\|[^|]+\|\s*/,"").trim();

        const a = parseFlowNodeToken(leftToken);
        const b = parseFlowNodeToken(rightClean);

        const na = ensureNode(a.id, a.text);
        const nb = ensureNode(b.id, b.text);
        if (na && nb) edges.push({ from: na.id, to: nb.id, label });

        // "A[Text]"のようにノード宣言だけの行もあるが、今回は省略（必要なら後で追加）
      }

      // レイアウト（DAG）
      layoutDAG(nodes, edges);

      return { mode: "flowchart", nodes, edges };
    }

    function layoutDAG(nodes, edges){
      if (!nodes.length) return;
      const byId = new Map(nodes.map(n=>[n.id,n]));
      const out = new Map(nodes.map(n=>[n.id, []]));
      const indeg = new Map(nodes.map(n=>[n.id, 0]));
      for (const e of (edges||[])){
        if (!byId.has(e.from) || !byId.has(e.to)) continue;
        out.get(e.from).push(e.to);
        indeg.set(e.to, (indeg.get(e.to)||0)+1);
      }

      // Kahn
      const q = [];
      for (const [id,deg] of indeg.entries()) if (deg===0) q.push(id);
      // サイクルっぽいときは全て0扱い
      if (!q.length) for (const id of indeg.keys()) q.push(id);

      const level = new Map();
      q.forEach(id => level.set(id, 0));

      const topo = [];
      while(q.length){
        const id = q.shift();
        topo.push(id);
        const base = level.get(id)||0;
        for (const nx of out.get(id)||[]){
          const cand = base+1;
          level.set(nx, Math.max(level.get(nx)||0, cand));
          indeg.set(nx, (indeg.get(nx)||0)-1);
          if (indeg.get(nx)===0) q.push(nx);
        }
      }

      // レベルごとにグループ
      const groups = new Map();
      for (const n of nodes){
        const lv = level.get(n.id) || 0;
        if (!groups.has(lv)) groups.set(lv, []);
        groups.get(lv).push(n);
      }

      const levels = Array.from(groups.keys()).sort((a,b)=>a-b);
      const baseX = 2000;
      const baseY = 2000;

      const xSpacing = config.levelSpacing;
      const ySpacing = 140;

      // 並び順（mid/テキスト）で安定化
      for (const lv of levels){
        groups.get(lv).sort((a,b)=>{
          const aa = (a.mid||a.text||"").toString();
          const bb = (b.mid||b.text||"").toString();
          return aa.localeCompare(bb, "en");
        });
      }

      // 各レベルを縦に配置
      for (const lv of levels){
        const arr = groups.get(lv);
        const totalH = (arr.length-1)*ySpacing;
        for (let i=0;i<arr.length;i++){
          const n = arr[i];
          n.x = baseX + lv * xSpacing;
          n.y = baseY - totalH/2 + i*ySpacing;
        }
      }
    }

function parseMermaidMindmap(src){
      const lines = src
        .replace(/\r/g,"")
        .split("\n")
        .map(l => l.replace(/\t/g,"  "))
        .filter(l => l.trim().length);

      if (!lines.length) return null;
      if (!lines[0].trim().startsWith("mindmap")) return null;

      let nodes = [];
      let stack = [];
      let idCounter = 0;

      nodes.push({ id:"root", text:"アイデアの種", x:2000, y:2000, parentId:null, isRoot:true, color:"sky", collapsed:false });
      stack.push({ id:"root", indent:0 });

      for (let i=1;i<lines.length;i++){
        const raw = lines[i];
        const indent = (raw.match(/^\s*/)[0] || "").length;
        let label = raw.trim();

        const mm1 = label.match(/^(?:root|[A-Za-z0-9_\-]+)\s*\(\((.*)\)\)\s*$/);
        if (mm1) label = mm1[1];
        const mm2 = label.match(/^(?:root|[A-Za-z0-9_\-]+)\s*\[(.*)\]\s*$/);
        if (mm2) label = mm2[1];
        const mm3 = label.match(/^(?:root|[A-Za-z0-9_\-]+)\s*\{(.*)\}\s*$/);
        if (mm3) label = mm3[1];

        while (stack.length && indent <= stack[stack.length-1].indent) stack.pop();
        if (!stack.length) stack = [{ id:"root", indent:0 }];

        const parentId = stack[stack.length-1].id;

        if (/^root\b/i.test(raw.trim())) {
          const root = nodes.find(n=>n.id==="root");
          root.text = (label && label.trim().length) ? label.trim() : root.text;
          stack.push({ id:"root", indent });
          continue;
        }

        const id = "n-" + (++idCounter).toString(36) + Math.random().toString(36).slice(2,6);
        const parent = nodes.find(n=>n.id===parentId) || nodes[0];

        nodes.push({
          id,
          text: (label && label.trim().length) ? label.trim() : "Node",
          parentId,
          x: parent.x + config.levelSpacing,
          y: parent.y + (Math.random()-0.5)*240,
          color: parent.color || "sky",
          collapsed:false
        });

        stack.push({ id, indent });
      }

      layoutTree(nodes, "root");
      if (config.avoidOverlap) relaxOverlaps();
      return { mode: "mindmap", nodes, edges: [] };
    }

    function layoutTree(nodes, rootId){
      const byId = new Map(nodes.map(n=>[n.id,n]));
      const children = new Map();
      for (const n of nodes) children.set(n.id, []);
      for (const n of nodes){
        if (n.parentId && children.has(n.parentId)) children.get(n.parentId).push(n.id);
      }

      const root = byId.get(rootId);
      if (!root) return;

      root.x = 2000; root.y = 2000;
      let yCursor = root.y - 420;

      function dfs(id, depth){
        const node = byId.get(id);
        if (!node) return;

        node.x = root.x + depth * config.levelSpacing;

        const kids = children.get(id) || [];
        if (!kids.length){
          yCursor += 130;
          node.y = yCursor;
          return;
        }
        for (const c of kids) dfs(c, depth+1);

        const ys = kids.map(cid => byId.get(cid)?.y).filter(v=>typeof v==="number");
        node.y = ys.length ? ys.reduce((a,b)=>a+b,0)/ys.length : node.y;
      }

      dfs(rootId, 0);
      root.y = 2000;
    }

    // ---------------- init ----------------
    function init() {
      const stored = safeParse(localStorage.getItem(STORAGE_KEY));
      if (stored && stored.nodes && Array.isArray(stored.nodes)) {
        state.nodes = stored.nodes;
        state.selectedId = stored.selectedId || "root";
        state.scale = stored.scale ?? 1;
        state.panX = stored.panX ?? (window.innerWidth / 2 - 2000);
        state.panY = stored.panY ?? (window.innerHeight / 2 - 2000);
        for (const n of state.nodes) {
          if (typeof n.collapsed !== "boolean") n.collapsed = false;
          if (!n.color) n.color = "sky";
          if (n.id === "root") n.isRoot = true;
        }
      } else {
        const example = parseMermaidMindmap(`mindmap
  root((アイデアの種))
    リサーチ
      ユーザー調査
        インタビュー
        ペルソナ
      市場分析
    開発
      アーキテクチャ
      API/DB
    デザイン
      UXフロー
      UIコンポーネント`);
        if (example) state.nodes = example;
        scheduleSave(true);
      }

      pushHistory();
      update(true);
      setupEventListeners();
      markSaved();
    }

    init();
  </script>
  <script>
    // PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(()=>{});
      });
    }
  </script>
</body>
</html>
